<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вхід · КТ Сталь</title>
<style>
* { box-sizing: border-box; }
:root {
    --kt-yellow: #ffe600;
    --kt-yellow-hover: #ffd000;
    --kt-yellow-strong: #f0b800;
    --kt-graphite: #3a3f4a;
    --kt-graphite-2: #4a505c;
}
html, body { margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #1f2937; min-height: 100vh; }
body { display: flex; align-items: center; justify-content: center; padding: 16px; }
.box {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 28px 24px 24px; max-width: 380px; width: 100%;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
}
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; padding: 12px 14px; background: var(--kt-graphite); color: #fff; border-radius: 8px; }
.brand-title { font-size: 16px; font-weight: 700; }
.brand-sub { font-size: 11px; color: #d1d5db; margin-top: 2px; }
h1 { margin: 0 0 14px 0; font-size: 16px; color: var(--kt-graphite); font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 12px; color: #6b7280; font-weight: 600; }
.field input {
    padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 16px; font-family: inherit;
}
.field input:focus { outline: none; border-color: var(--kt-yellow-strong); box-shadow: 0 0 0 2px rgba(255,208,0,0.2); }
.btn {
    width: 100%; padding: 12px;
    background: var(--kt-yellow); color: var(--kt-graphite);
    border: 1px solid var(--kt-yellow-strong); border-radius: 8px;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
    box-shadow: 0 2px 0 var(--kt-yellow-strong);
}
.btn:hover { background: var(--kt-yellow-hover); }
.btn:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--kt-yellow-strong); }
.msg { color: #dc2626; font-size: 13px; margin: 8px 0 4px; min-height: 18px; }
</style>
</head>
<body>
<form class="box" method="POST" action="/login" autocomplete="on">
    <div class="brand">
        <div>
            <div class="brand-title">КТ Сталь</div>
            <div class="brand-sub">Калькулятор порізки</div>
        </div>
    </div>
    <h1>Вхід</h1>
    <div class="field">
        <label for="u">Логін</label>
        <input id="u" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="field">
        <label for="p">Пароль</label>
        <input id="p" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="msg">{{MSG}}</div>
    <button type="submit" class="btn">Увійти</button>
</form>
</body>
</html>
