# /etc/nginx/sites-available/raskroy
# Serve KT Stal calculator over HTTPS via reverse proxy to Node.js.
# After saving, run: sudo ln -s /etc/nginx/sites-available/raskroy /etc/nginx/sites-enabled/
# Then issue a cert with certbot --nginx -d porizka.example.com

server {
    listen 80;
    server_name porizka.example.com;

    # Let's Encrypt http-01 challenge:
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    # Everything else → HTTPS
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name porizka.example.com;

    # certbot will fill these in:
    # ssl_certificate     /etc/letsencrypt/live/porizka.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/porizka.example.com/privkey.pem;

    # Sensible defaults
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
