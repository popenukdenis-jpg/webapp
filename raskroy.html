<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КТ Сталь · Розкрій металопрокату</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #1f2937; }
body { padding: 16px; max-width: 1100px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px 0; }
h2 { font-size: 15px; margin: 0 0 10px 0; color: #374151; text-transform: uppercase; letter-spacing: 0.5px; }
.sub { color: #6b7280; font-size: 13px; margin-bottom: 18px; }

.card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }

.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: #6b7280; }
.field input[type=text], .field input[type=number] {
    padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px;
    font-size: 16px; font-family: inherit; min-width: 80px;
}
.field input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }

.toggle { display: inline-flex; border: 1px solid #d1d5db; border-radius: 6px; overflow: hidden; }
.toggle button {
    padding: 7px 14px; border: none; background: #fff; cursor: pointer;
    font-size: 14px; font-family: inherit; color: #374151; border-right: 1px solid #d1d5db;
}
.toggle button:last-child { border-right: none; }
.toggle button.active { background: #3b82f6; color: #fff; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #f1f3f5; }
th { font-weight: 600; font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.3px; }
td input { width: 100%; padding: 5px 7px; border: 1px solid transparent; border-radius: 4px; font-size: 16px; font-family: inherit; background: transparent; }
td input:hover { border-color: #e5e7eb; }
td input:focus { outline: none; border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
td.num input { text-align: right; font-variant-numeric: tabular-nums; }
td.act { width: 32px; text-align: center; }
.del { background: none; border: none; cursor: pointer; color: #ef4444; font-size: 16px; padding: 2px 6px; border-radius: 4px; }
.del:hover { background: #fee2e2; }

.btn { padding: 8px 14px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; font-size: 14px; font-family: inherit; color: #374151; }
.btn:hover { background: #f9fafb; }
.btn.primary { background: #3b82f6; color: #fff; border-color: #3b82f6; }
.btn.primary:hover { background: #2563eb; }
.btn.big { padding: 12px 22px; font-size: 16px; font-weight: 600; }
.btn.ghost { background: transparent; border-color: transparent; color: #3b82f6; }
.btn.ghost:hover { background: #eff6ff; }

.toolbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

#result { display: none; }
#result.show { display: block; }

.summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 14px; }
.stat { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px 10px; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; }
.stat .k { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.4px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v { font-size: 16px; font-weight: 600; color: #111827; font-variant-numeric: tabular-nums; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.good .v { color: #059669; }
.stat.warn .v { color: #d97706; }
.stat.bad .v { color: #dc2626; }
.stat input.price-input { width: 100%; padding: 2px 6px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 16px; font-weight: 600; font-family: inherit; font-variant-numeric: tabular-nums; color: #111827; background: #fff; box-sizing: border-box; }
.stat input.price-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
.stat.cost .v { color: #7c3aed; }

.bar { margin: 6px 0; }
.bar-head { display: flex; justify-content: space-between; font-size: 13px; color: #374151; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
.bar-svg { width: 100%; height: 26px; display: block; }
.bar-svg rect.cut { stroke: #1f2937; stroke-width: 1; }
.bar-svg rect.tail-rem { fill: #fde68a; stroke: #b45309; stroke-width: 1; }
.bar-svg rect.tail-waste { fill: #fecaca; stroke: #b91c1c; stroke-width: 1; }
.bar-svg text { font-size: 17px; font-weight: 600; font-family: system-ui; fill: #111827; pointer-events: none; }

.unplaced { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 10px 14px; border-radius: 6px; margin-top: 10px; font-size: 13px; }

.legend { display: flex; gap: 14px; font-size: 12px; color: #6b7280; margin-top: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: middle; margin-right: 4px; border: 1px solid rgba(0,0,0,0.15); }

.footer-act { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

@page { size: A4; margin: 10mm; }
@media print {
    body { background: #fff; padding: 0; max-width: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .no-print { display: none !important; }
    header { display: block !important; padding: 0; margin-bottom: 8px; border-bottom: 2px solid #111; padding-bottom: 6px; }
    header h1 { font-size: 16px; margin: 0; }
    header .sub { font-size: 11px; color: #555; margin: 0; }
    #result { display: block !important; }
    .bar { page-break-inside: avoid; break-inside: avoid; }
    .card, .result-block { box-shadow: none; border: none; padding: 0; margin-bottom: 8px; page-break-inside: avoid; break-inside: avoid; }
    .result-head { background: #fff; border-bottom: 1px solid #111; padding: 4px 0; cursor: default; page-break-after: avoid; break-after: avoid; }
    .result-head .caret { display: none; }
    .result-body, .result-body.hidden { display: block !important; padding: 4px 0; }
    .summary { page-break-inside: avoid; break-inside: avoid; }
    h1 { font-size: 16px; }
    .stat { background: #fff; }
    .print-header { display: block !important; border-bottom: 2px solid #111; margin-bottom: 12px; padding-bottom: 6px; }

    /* Режим «для склада»: показываем только хлысты, прячем общую сводку и клиентскую */
    body:not(.print-client) .order-summary,
    body:not(.print-client) .client-view,
    body:not(.print-client) .wh-print-header { /* wh-print-header reserved */ }
    body:not(.print-client) .order-summary { display: none !important; }
    body:not(.print-client) .client-view { display: none !important; }

    /* Режим «для клиента»: общая сводка по заказу + клиентская табличка, без карты реза */
    body.print-client .result-block { display: none !important; }
    body.print-client .order-summary { display: block !important; }
    body.print-client .client-view { display: block !important; }
    body.print-client .wh-print-header { display: none !important; }

    /* В печати для склада не показываем цену и стоимость резов */
    body:not(.print-client) .no-wh-print { display: none !important; }
}
.print-header { display: none; }
.print-header h1 { margin-bottom: 2px; }
.print-header .meta { font-size: 12px; color: #374151; }

@media (max-width: 640px) {
    body { padding: 10px; }
    h1 { font-size: 18px; }
    h2 { font-size: 13px; margin-bottom: 8px; }
    .card { padding: 10px 12px; }
    .row { gap: 8px; }
    .field { flex: 1 1 calc(50% - 4px); min-width: 0; }
    .field input[type=text], .field input[type=number] { font-size: 16px; min-width: 0; width: 100%; }
    .nom-head { padding: 8px 10px; gap: 6px; }
    .nom-head .name-input { flex: 1 1 100%; min-width: 0; font-size: 16px; order: 1; }
    .nom-head .caret { order: 0; }
    .nom-head .nom-del { order: 0; margin-left: auto; }
    .nom-head .nom-meta { order: 2; font-size: 11px; flex: 0 0 auto; }
    .nom-head [data-len-toggle] { order: 3; }
    .nom-head [data-custom-len] { order: 4; flex: 1; min-width: 80px; }
    .toggle button { padding: 6px 10px; font-size: 13px; }
    .nom-body { padding: 8px 10px; }
    table { font-size: 13px; }
    th, td { padding: 4px 6px; }
    td input { font-size: 16px; }
    .summary { gap: 6px; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); }
    .stat { padding: 6px 8px; }
    .stat .v { font-size: 14px; }
    .btn { padding: 7px 10px; font-size: 13px; }
    .btn.big { padding: 10px 16px; font-size: 14px; }
    .toolbar { gap: 6px; }
    .footer-act .btn { flex: 1 1 calc(50% - 5px); }
    .legend { gap: 8px; flex-wrap: wrap; }
    .result-head { padding: 10px 12px; gap: 6px; flex-wrap: wrap; }
    .result-head .meta { width: 100%; margin-left: 0; }
    .result-body { padding: 10px 12px; }
    .bar-head { font-size: 12px; }
    .bar-svg { height: 22px; }
    .bar-svg text { font-size: 13px; }
}

.client-view { display: none; }
.cv-block { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); overflow: hidden; page-break-inside: avoid; break-inside: avoid; }
.cv-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #eff6ff; border-bottom: 1px solid #dbeafe; }
.cv-head .title { font-weight: 600; font-size: 15px; color: #111827; }
.cv-head .badge { background: #1d4ed8; color: #fff; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; }
.cv-head .meta { font-size: 12px; color: #6b7280; margin-left: auto; }
.cv-body { padding: 14px 16px; }
.cv-tbl { border-collapse: collapse; margin-top: 10px; }
.cv-tbl th, .cv-tbl td { border: 1px solid #d1d5db; padding: 6px 14px; font-size: 13px; }
.cv-tbl th { background: #f9fafb; font-weight: 600; color: #374151; text-transform: uppercase; letter-spacing: 0.3px; font-size: 11px; }
.cv-tbl td { text-align: right; font-variant-numeric: tabular-nums; }
.cv-tbl td:first-child { color: #6b7280; }
.cv-foot { margin-top: 14px; padding: 10px 14px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 13px; font-weight: 600; color: #111827; }

.nom-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); overflow: hidden; }
.nom-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; }
.nom-head .caret { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; color: #374151; font-size: 18px; font-weight: 700; line-height: 1; border: 1px solid #d1d5db; border-radius: 4px; background: #fff; flex: 0 0 auto; }
.nom-head .caret:hover { background: #f3f4f6; }
.nom-head .name-input { flex: 1; min-width: 220px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 16px; font-family: inherit; background: #fff; }
.nom-head .name-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
.nom-head .nom-meta { font-size: 12px; color: #6b7280; margin-right: auto; }
.nom-head .nom-del { background: none; border: none; cursor: pointer; color: #ef4444; font-size: 18px; padding: 4px 8px; border-radius: 4px; }
.nom-head .nom-del:hover { background: #fee2e2; }
.nom-body { padding: 12px 14px; }
.nom-body.hidden { display: none; }

.add-nom { display: flex; justify-content: center; margin: 4px 0 14px; }

.result-block { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); overflow: hidden; }
.result-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #eff6ff; border-bottom: 1px solid #dbeafe; cursor: pointer; user-select: none; }
.result-head .caret { color: #1d4ed8; font-size: 18px; font-weight: 700; line-height: 1; width: 22px; display: inline-flex; align-items: center; justify-content: center; }
.result-head .title { font-weight: 600; font-size: 15px; color: #111827; }
.result-head .badge { background: #1d4ed8; color: #fff; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; }
.result-head .meta { font-size: 12px; color: #6b7280; margin-left: auto; }
.result-body { padding: 14px 16px; }
.result-body.hidden { display: none; }

.tabs { display: flex; gap: 2px; margin-bottom: 14px; border-bottom: 2px solid #e5e7eb; }
.tab { padding: 10px 18px; background: none; border: none; cursor: pointer; font-size: 14px; color: #6b7280; border-bottom: 2px solid transparent; margin-bottom: -2px; font-weight: 500; font-family: inherit; }
.tab:hover { color: #1d4ed8; }
.tab.active { color: #1d4ed8; border-bottom-color: #1d4ed8; font-weight: 600; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.size-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: end; }
.size-grid label { font-size: 12px; color: #6b7280; }
.piece-tbl th:nth-child(2), .piece-tbl th:nth-child(3), .piece-tbl th:nth-child(4) { width: 25%; }
.sheet-svg { display: block; background: #fff; border: 1px solid #555; max-width: 100%; max-height: 50vh; width: auto; height: auto; margin: 0 auto; }
@media print {
    .sheet-svg { max-height: 80vh; }
}
</style>
</head>
<body>

<header>
    <h1>КТ Сталь · Розкрій металопрокату</h1>
    <div class="sub">1D лінійний · 2D листовий · карта різу для складу</div>
</header>

<div class="tabs no-print">
    <button class="tab active" data-tab="linear">Лінійний розкрій</button>
    <button class="tab" data-tab="sheet">Розкрій листа</button>
</div>

<div id="tabLinear" class="tab-panel active">

<div class="card no-print">
    <h2>Замовлення</h2>
    <div class="row">
        <div class="field">
            <label>№ замовлення</label>
            <input type="text" id="fOrder" placeholder="ЗМ-00123">
        </div>
        <div class="field">
            <label>Ширина різу (kerf), мм</label>
            <input type="number" id="fKerf" min="0" step="0.5" placeholder="0">
        </div>
        <div class="field">
            <label>Мін. діловий залишок, мм</label>
            <input type="number" id="fMinRem" min="0" step="10" placeholder="0">
        </div>
    </div>
</div>

<div id="profilesContainer" class="no-print"></div>

<div class="add-nom no-print">
    <button class="btn" id="btnAddProfile">+ Додати номенклатуру</button>
</div>

<div class="card no-print" style="text-align:center;">
    <button class="btn primary big" id="btnCalc">Розрахувати карту розкрою</button>
</div>

<div id="result"></div>

</div><!-- /#tabLinear -->

<div id="tabSheet" class="tab-panel">

<div class="card no-print">
    <h2>Замовлення (лист)</h2>
    <div class="row">
        <div class="field">
            <label>№ замовлення</label>
            <input type="text" id="fOrderSheet" placeholder="ЗМ-00123">
        </div>
        <div class="field">
            <label>Ширина різу (kerf), мм</label>
            <input type="number" id="fKerfSheet" min="0" step="0.5" placeholder="0">
        </div>
        <div class="field">
            <label>Ціна врізки, грн</label>
            <input type="number" id="fPiercePrice" min="0" step="0.5" placeholder="0">
        </div>
        <div class="field">
            <label>Ціна 1 м різу, грн</label>
            <input type="number" id="fCutMeterPrice" min="0" step="0.5" placeholder="0">
        </div>
    </div>
</div>

<div id="sheetsContainer" class="no-print"></div>

<div class="add-nom no-print">
    <button class="btn" id="btnAddSheet">+ Додати номенклатуру</button>
</div>

<div class="card no-print" style="text-align:center;">
    <button class="btn primary big" id="btnCalcSheet">Розрахувати розкрій листа</button>
</div>

<div id="resultSheet"></div>

</div><!-- /#tabSheet -->

<script>
// === Состояние ===
const state = {
    activeTab: 'linear',
    order: '',
    kerf: 0,
    minRem: 0,
    profiles: [],   // [{id, name, barLen, collapsed, cuts:[{length,qty}]}]
    result: null,

    // Для листового раскроя
    orderSheet: '',
    kerfSheet: 0,
    piercePrice: 0,
    cutMeterPrice: 0,
    sheets: [],     // [{id, name, sheetW, sheetH, collapsed, pieces:[{w,h,qty}]}]
    resultSheet: null,
};

const STORAGE_KEY = 'raskroy.v4';
let nextProfId = 1;
let nextSheetId = 1;

function newProfile(name = '', barLen = 12000) {
    return { id: nextProfId++, name, barLen, cutPrice: 0, collapsed: false, cuts: [{ length: 0, qty: 0 }] };
}

function newSheet(name = '', sheetW = 1500, sheetH = 6000, thickness = 0) {
    return { id: nextSheetId++, name, sheetW, sheetH, thickness, collapsed: false, pieces: [{ w: 0, h: 0, qty: 0 }] };
}

function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({
        activeTab: state.activeTab,
        order: state.order, kerf: state.kerf, minRem: state.minRem, profiles: state.profiles,
        orderSheet: state.orderSheet, kerfSheet: state.kerfSheet,
        piercePrice: state.piercePrice, cutMeterPrice: state.cutMeterPrice, sheets: state.sheets,
    })); } catch (e) {}
}
function load() {
    try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (s) {
            state.activeTab = s.activeTab || 'linear';
            state.order = s.order || '';
            state.kerf = s.kerf ?? 0;
            state.minRem = s.minRem ?? 0;
            if (Array.isArray(s.profiles)) {
                state.profiles = s.profiles;
                for (const p of state.profiles) if (p.id >= nextProfId) nextProfId = p.id + 1;
            }
            state.orderSheet = s.orderSheet || '';
            state.kerfSheet = s.kerfSheet ?? 0;
            state.piercePrice = s.piercePrice ?? 0;
            state.cutMeterPrice = s.cutMeterPrice ?? 0;
            if (Array.isArray(s.sheets)) {
                state.sheets = s.sheets;
                for (const sh of state.sheets) if (sh.id >= nextSheetId) nextSheetId = sh.id + 1;
            }
            return;
        }
        // миграция со старых v3
        const old3 = JSON.parse(localStorage.getItem('raskroy.v3') || 'null');
        if (old3 && Array.isArray(old3.profiles)) {
            state.order = old3.order || '';
            state.profiles = old3.profiles;
            for (const p of state.profiles) if (p.id >= nextProfId) nextProfId = p.id + 1;
            return;
        }
        // миграция со старых версий — переносим только профили и заказ, ширину реза/мин.остаток обнуляем
        const v2 = JSON.parse(localStorage.getItem('raskroy.v2') || 'null');
        if (v2 && Array.isArray(v2.profiles)) {
            state.order = v2.order || '';
            state.profiles = v2.profiles;
            for (const p of state.profiles) if (p.id >= nextProfId) nextProfId = p.id + 1;
            return;
        }
        const old = JSON.parse(localStorage.getItem('raskroy.v1') || 'null');
        if (old) {
            state.order = old.order || '';
            state.profiles = [{
                id: nextProfId++, name: old.profile || '', barLen: old.barLen || 12000,
                collapsed: false, cuts: old.cuts || [],
            }];
        }
    } catch (e) {}
}

// === Рендер блоков номенклатур ===
function profileHtml(p, idx) {
    const lenButtons = [6000, 12000].map(l =>
        `<button data-len="${l}" class="${p.barLen === l ? 'active' : ''}">${l / 1000} м</button>`
    ).join('') + `<button data-len="custom" class="${(p.barLen !== 6000 && p.barLen !== 12000) ? 'active' : ''}">другое</button>`;
    const isCustom = (p.barLen !== 6000 && p.barLen !== 12000);
    const rows = p.cuts.map((c, i) => `
        <tr>
            <td style="color:#6b7280; font-variant-numeric:tabular-nums; width:40px;">${i + 1}</td>
            <td class="num"><input type="number" min="1" step="1" value="${c.length || ''}" data-ci="${i}" data-k="length"></td>
            <td class="num"><input type="number" min="1" step="1" value="${c.qty || ''}" data-ci="${i}" data-k="qty"></td>
            <td class="act"><button class="del" data-del-cut="${i}" title="Удалить">✕</button></td>
        </tr>
    `).join('') || `<tr><td colspan="4" style="color:#9ca3af; text-align:center; padding:16px;">Додайте рядки кнопкою нижче</td></tr>`;

    const totalCuts = p.cuts.reduce((s, c) => s + ((c.length | 0) > 0 && (c.qty | 0) > 0 ? c.qty : 0), 0);

    return `<div class="nom-card" data-pid="${p.id}">
        <div class="nom-head">
            <span class="caret" data-toggle title="${p.collapsed ? 'Розгорнути' : 'Згорнути'}">${p.collapsed ? '+' : '−'}</span>

// === Оптимизатор ===
// Алгоритм: «best pattern next» — на каждой итерации находим оптимальное
// заполнение одной заготовки через 0/1-knapsack DP по длине.
// Хитрость с резом (kerf): к каждому отрезку добавляем kerf, к ёмкости тоже +kerf —
// так n отрезков на одной заготовке корректно учитывают (n-1) резов между ними.

function bestPattern(items, capacity) {
    const n = items.length;
    const cap = capacity | 0;
    if (n === 0 || cap <= 0) return { picks: [], sum: 0 };
    const dp = new Int32Array(cap + 1);
    const take = new Uint8Array(n * (cap + 1));
    for (let i = 0; i < n; i++) {
        const w = items[i].w;
        if (w > cap) continue;
        const off = i * (cap + 1);
        for (let c = cap; c >= w; c--) {
            const v = dp[c - w] + w;
            if (v > dp[c]) { dp[c] = v; take[off + c] = 1; }
        }
    }
    let bestC = 0, bestV = 0;
    for (let c = 0; c <= cap; c++) if (dp[c] > bestV) { bestV = dp[c]; bestC = c; }
    let c = bestC;
    const picks = [];
    for (let i = n - 1; i >= 0; i--) {
        if (take[i * (cap + 1) + c]) { picks.push(i); c -= items[i].w; }
    }
    return { picks, sum: bestV };
}

function optimize(cuts, barLen, kerf, minRem) {
    const items = [];
    let nid = 0;
    cuts.forEach((c, ci) => {
        const len = c.length | 0, qty = c.qty | 0;
        if (len <= 0 || qty <= 0) return;
        for (let q = 0; q < qty; q++) items.push({ id: nid++, len, mark: c.mark || '', srcIdx: ci });
    });
    if (items.length > 1500) return { error: `Забагато відрізків (${items.length}). Ліміт 1500 — розбийте на частини.` };
    if (items.length === 0) return { error: 'Не задано жодного відрізка з довжиною та кількістю.' };

    const placeable = [], unplaced = [];
    for (const it of items) (it.len > barLen ? unplaced : placeable).push(it);

    const bars = [];
    let remaining = placeable.slice();
    const cap = (barLen + kerf) | 0;
    let safety = remaining.length + 5;

    while (remaining.length > 0 && safety-- > 0) {
        const dpItems = remaining.map((it, idx) => ({ idx, w: (it.len + kerf) | 0 }));
        const pat = bestPattern(dpItems, cap);
        if (pat.picks.length === 0) break;
        const placedSet = new Set(pat.picks);
        const placed = pat.picks.map(i => remaining[i]).sort((a, b) => b.len - a.len);
        const cutsLen = placed.reduce((s, it) => s + it.len, 0);
        const kerfTot = Math.max(0, placed.length - 1) * kerf;
        const tail = Math.max(0, barLen - cutsLen - kerfTot);
        bars.push({ cuts: placed, usedLen: cutsLen, kerfTotal: kerfTot, tail, isRemnant: tail >= minRem });
        remaining = remaining.filter((_, idx) => !placedSet.has(idx));
    }

    const totalBarsLen = bars.length * barLen;
    const totalCutsLen = bars.reduce((s, b) => s + b.usedLen, 0);
    const totalKerf = bars.reduce((s, b) => s + b.kerfTotal, 0);
    const totalRemnant = bars.filter(b => b.isRemnant).reduce((s, b) => s + b.tail, 0);
    const totalWaste = bars.filter(b => !b.isRemnant).reduce((s, b) => s + b.tail, 0) + totalKerf;

    return { bars, unplaced, totalBarsLen, totalCutsLen, totalKerf, totalRemnant, totalWaste, barLen, kerf, minRem };
}

// === Утилиты ===
function esc(s) { return String(s ?? '').replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMm(mm) { return mm >= 1000 ? (mm / 1000).toFixed(2).replace(/\.?0+$/, '') + ' м' : Math.round(mm) + ' мм'; }
function pct(p) { return p.toFixed(1) + '%'; }
function fmtMoney(v) {
    if (!v) return 'Безкоштовно';
    const r = Math.round(v * 100) / 100;
    const s = r.toFixed(r % 1 === 0 ? 0 : 2).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return s + ' грн';
}

function renderResult(report) {
    const root = document.getElementById('result');
    if (!report) { root.classList.remove('show'); root.innerHTML = ''; return; }
    const dateStr = new Date().toLocaleDateString('ru-RU');

    let html = '';
    html += `<div class="print-header wh-print-header">
        <div class="meta">Замовлення: <b>${esc(state.order) || '—'}</b> · Дата: ${dateStr}</div>
    </div>`;

    // Предварительно посчитаем резы и стоимость для каждого блока
    report.results.forEach(entry => {
        const r = entry.r;
        if (!r || r.error || !r.bars) { entry.sawCuts = 0; entry.cost = 0; return; }
        entry.sawCuts = r.bars.reduce((s, b) => {
            const n = b.cuts.length;
            if (n === 0) return s;
            return s + (n - 1) + (b.tail > 0 ? 1 : 0);
        }, 0);
        entry.cost = entry.sawCuts * (+entry.profile.cutPrice || 0);
    });

    // Общая сводка по всем номенклатурам
    const totalBars = report.results.reduce((s, x) => s + (x.r.bars ? x.r.bars.length : 0), 0);
    const totalLen = report.results.reduce((s, x) => s + (x.r.totalBarsLen || 0), 0);
    const totalCutsLen = report.results.reduce((s, x) => s + (x.r.totalCutsLen || 0), 0);
    const totalWaste = report.results.reduce((s, x) => s + (x.r.totalWaste || 0), 0);
    const totalRem = report.results.reduce((s, x) => s + (x.r.totalRemnant || 0), 0);
    const totalSawCuts = report.results.reduce((s, x) => s + (x.sawCuts || 0), 0);
    const totalCost = report.results.reduce((s, x) => s + (x.cost || 0), 0);
    const usedPct = totalLen > 0 ? (totalCutsLen / totalLen * 100) : 0;
    const wastePct = totalLen > 0 ? (totalWaste / totalLen * 100) : 0;

    html += `<div class="card order-summary"><h2 class="no-print">Зведення по замовленню</h2>
        <div class="summary">
            <div class="stat"><div class="k">Номенклатур</div><div class="v">${report.results.length}</div></div>
            <div class="stat"><div class="k">Хлистів всього</div><div class="v">${totalBars}</div></div>
            <div class="stat"><div class="k">Довжина металу</div><div class="v">${fmtMm(totalLen)}</div></div>
            <div class="stat good"><div class="k">У деталях</div><div class="v">${pct(usedPct)}</div></div>
            <div class="stat warn"><div class="k">Залишок</div><div class="v">${fmtMm(totalRem)}</div></div>
            <div class="stat"><div class="k">Різів всього</div><div class="v" data-total-saw>${totalSawCuts}</div></div>
            <div class="stat cost"><div class="k">Вартість різів</div><div class="v" data-total-cost>${fmtMoney(totalCost)}</div></div>
        </div>
        <div class="legend no-print">
            <span><i style="background:#bfdbfe;border-color:#1d4ed8;"></i>відріз</span>
            <span><i style="background:#fde68a;border-color:#b45309;"></i>залишок</span>
            <span><i style="background:#374151;border-color:#374151;"></i>пропил</span>
        </div>
    </div>`;

    // Блок на каждую номенклатуру
    report.results.forEach((entry, idx) => {
        const { profile: p, r } = entry;
        const blockId = 'block_' + p.id;
        const collapsed = !!entry.collapsed;
        if (r.error) {
            html += `<div class="result-block">
                <div class="result-head">
                    <span class="title">${esc(p.name) || 'Номенклатура №' + (idx + 1)}</span>
                    <span class="meta">${fmtMm(p.barLen)} · ошибка</span>
                </div>
                <div class="result-body"><div class="unplaced">${esc(r.error)}</div></div>
            </div>`;
            return;
        }
        const usedP = r.totalBarsLen > 0 ? (r.totalCutsLen / r.totalBarsLen * 100) : 0;
        const sawCuts = entry.sawCuts;
        const price = +p.cutPrice || 0;
        const cost = entry.cost;
        let bodyHtml = `<div class="summary">
            <div class="stat"><div class="k">Хлистів</div><div class="v">${r.bars.length}</div></div>
            <div class="stat"><div class="k">Заготовка</div><div class="v">${fmtMm(r.barLen)}</div></div>
            <div class="stat good"><div class="k">У деталях</div><div class="v">${pct(usedP)}</div></div>
            <div class="stat warn"><div class="k">Залишок</div><div class="v">${fmtMm(r.totalRemnant)}</div></div>
            <div class="stat"><div class="k">Різів</div><div class="v">${sawCuts}</div></div>
            <div class="stat no-wh-print"><div class="k">Ціна різу, грн</div><div class="v"><input class="price-input" type="number" min="0" step="0.5" value="${price || ''}" data-price="${p.id}" placeholder="0"></div></div>

        </div>`;
        r.bars.forEach((b, i) => { bodyHtml += renderBarSvg(b, i + 1, r.barLen, r.kerf, p.name); });
        if (r.unplaced && r.unplaced.length) {
            const list = r.unplaced.map(u => `${u.len} мм`).join(', ');
            bodyHtml += `<div class="unplaced"><b>Не вміщуються в заготовку ${fmtMm(r.barLen)}:</b> ${r.unplaced.length} шт. — ${list}</div>`;
        }
        html += `<div class="result-block" data-block="${blockId}">
            <div class="result-head" data-block-toggle>
                <span class="caret">${collapsed ? '+' : '−'}</span>
                <span class="title">${esc(p.name) || 'Номенклатура №' + (idx + 1)}</span>
                <span class="badge">${r.bars.length} ${pluralBars(r.bars.length)}</span>
                <span class="meta">${fmtMm(r.barLen)} · ${r.bars.reduce((s,b)=>s+b.cuts.length,0)} відр.</span>
            </div>
            <div class="result-body ${collapsed ? 'hidden' : ''}">${bodyHtml}</div>
        </div>`;
    });

    // Клиентская сводка — оформлена под стиль складских блоков
    let cvHtml = `<div class="client-view">
        <div class="print-header" style="display:block;">
            <div class="meta">Замовлення: <b>${esc(state.order) || '—'}</b> · Дата: ${dateStr}</div>
        </div>`;
    report.results.forEach((entry, idx) => {
        const p = entry.profile, r = entry.r;
        const validCuts = p.cuts.filter(c => (c.length | 0) > 0 && (c.qty | 0) > 0);
        const totalQty = validCuts.reduce((s, c) => s + (c.qty | 0), 0);
        const usedP = (r && !r.error && r.totalBarsLen > 0) ? (r.totalCutsLen / r.totalBarsLen * 100) : 0;
        cvHtml += `<div class="cv-block">
            <div class="cv-head">
                <span class="title">${esc(p.name) || 'Номенклатура №' + (idx + 1)}</span>
                ${(r && !r.error) ? `<span class="badge">${r.bars.length} ${pluralBars(r.bars.length)}</span>` : ''}
                <span class="meta">${fmtMm(p.barLen)} · ${totalQty} шт.</span>
            </div>
            <div class="cv-body">`;
        if (r && !r.error) {
            cvHtml += `<div class="summary">
                <div class="stat"><div class="k">Хлистів</div><div class="v">${r.bars.length}</div></div>
                <div class="stat"><div class="k">Заготовка</div><div class="v">${fmtMm(p.barLen)}</div></div>
                <div class="stat good"><div class="k">У деталях</div><div class="v">${pct(usedP)}</div></div>
                <div class="stat"><div class="k">Різів</div><div class="v">${entry.sawCuts || 0}</div></div>
                <div class="stat cost"><div class="k">Вартість різів</div><div class="v">${fmtMoney(entry.cost || 0)}</div></div>
            </div>`;
        }
        cvHtml += `<table class="cv-tbl"><thead><tr><th>№</th><th>Довжина, мм</th><th>Кількість</th></tr></thead><tbody>`;
        validCuts.forEach((c, i) => {
            cvHtml += `<tr><td>${i + 1}</td><td>${c.length}</td><td>${c.qty}</td></tr>`;
        });
        cvHtml += `</tbody></table>
            </div>
        </div>`;
    });
    cvHtml += `<div class="cv-foot">ВСЬОГО: ${totalBars} ${pluralBars(totalBars)} · Різів: ${totalSawCuts} · Вартість різів: ${fmtMoney(totalCost)}</div>`;
    cvHtml += `</div>`;
    html += cvHtml;

    html += `<div class="footer-act no-print">
        <button class="btn primary" id="btnPrintWh">🖨 Карта розкрою (склад)</button>
        <button class="btn primary" id="btnPrintCl">🖨 Замовлення (клієнт)</button>
        <button class="btn ghost" id="btnHide">Сховати</button>
    </div>`;

    root.classList.add('show');
    root.innerHTML = html;

    root.addEventListener('click', e => {
        const head = e.target.closest('[data-block-toggle]');
        if (!head) return;
        const block = head.parentElement;
        const body = block.querySelector('.result-body');
        const caret = head.querySelector('.caret');
        const hide = !body.classList.contains('hidden');
        body.classList.toggle('hidden', hide);
        if (caret) caret.textContent = hide ? '+' : '−';
    });

    root.addEventListener('input', e => {
        const inp = e.target.closest('[data-price]');
        if (!inp) return;
        const pid = +inp.dataset.price;
        const entry = report.results.find(x => x.profile.id === pid);
        if (!entry) return;
        const price = parseFloat(inp.value) || 0;
        entry.profile.cutPrice = price;
        entry.cost = (entry.sawCuts || 0) * price;
        const costEl = root.querySelector(`[data-cost="${pid}"]`);
        if (costEl) costEl.textContent = fmtMoney(entry.cost);
        const totalCost = report.results.reduce((s, x) => s + (x.cost || 0), 0);
        const totalEl = root.querySelector('[data-total-cost]');
        if (totalEl) totalEl.textContent = fmtMoney(totalCost);
        save();
    });

    function printAs(mode) {
        document.body.classList.toggle('print-client', mode === 'client');
        window.print();
    }
    window.addEventListener('afterprint', () => document.body.classList.remove('print-client'), { once: true });
    document.getElementById('btnPrintWh').addEventListener('click', () => printAs('warehouse'));
    document.getElementById('btnPrintCl').addEventListener('click', () => printAs('client'));
    document.getElementById('btnHide').addEventListener('click', () => {
        root.classList.remove('show'); root.innerHTML = ''; window.scrollTo({ top: 0, behavior: 'smooth' });
    });
}

function pluralBars(n) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 'хлист';
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'хлисти';
    return 'хлистів';
}

function renderBarSvg(b, num, barLen, kerf, profileName) {
    const W = 1000, H = 38;
    const scale = W / barLen;
    const palette = ['#bfdbfe','#a7f3d0','#fde68a','#fbcfe8','#c7d2fe','#fed7aa','#bae6fd','#d9f99d','#fecaca','#e9d5ff'];
    const colorByKey = new Map();
    let ci = 0;
    let x = 0;
    let svg = `<svg class="bar-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
    svg += `<rect x="0" y="2" width="${W}" height="${H - 4}" fill="#fff" stroke="#9ca3af"/>`;
    b.cuts.forEach((c, idx) => {
        const w = c.len * scale;
        const key = c.mark || ('L' + c.len);
        if (!colorByKey.has(key)) { colorByKey.set(key, palette[ci % palette.length]); ci++; }
        const fill = colorByKey.get(key);
        svg += `<rect class="cut" x="${x.toFixed(2)}" y="2" width="${w.toFixed(2)}" height="${H - 4}" fill="${fill}"/>`;
        if (w > 30) svg += `<text x="${(x + w / 2).toFixed(2)}" y="${(H / 2).toFixed(2)}" text-anchor="middle" dominant-baseline="central">${c.len}</text>`;
        x += w;
        if (idx < b.cuts.length - 1 && kerf > 0) {
            const kw = Math.max(0.6, kerf * scale);
            svg += `<rect x="${x.toFixed(2)}" y="2" width="${kw.toFixed(2)}" height="${H - 4}" fill="#374151"/>`;
            x += kw;
        }
    });
    if (b.tail > 0) {
        const tw = b.tail * scale;
        svg += `<rect class="${b.isRemnant ? 'tail-rem' : 'tail-waste'}" x="${x.toFixed(2)}" y="2" width="${tw.toFixed(2)}" height="${H - 4}"/>`;
        if (tw > 32) svg += `<text x="${(x + tw / 2).toFixed(2)}" y="${(H / 2).toFixed(2)}" text-anchor="middle" dominant-baseline="central">${Math.round(b.tail)}</text>`;
    }
    svg += `</svg>`;

    const tailLabel = b.tail <= 0 ? 'без залишку' : `залишок ${Math.round(b.tail)} мм`;
    const nameTxt = profileName ? ' ' + esc(profileName) : '';
    return `<div class="bar">
        <div class="bar-head">
            <span><b>Хлист${nameTxt} №${num}</b> · ${b.cuts.length} відр.</span>
            <span>${tailLabel}</span>
        </div>
        ${svg}
    </div>`;
}

document.getElementById('btnCalc').addEventListener('click', () => {
    if (!state.profiles.length) { alert('Додайте хоча б одну номенклатуру.'); return; }
    const valid = state.profiles.filter(p => p.cuts.some(c => (c.length | 0) > 0 && (c.qty | 0) > 0));
    if (!valid.length) { alert('Заповніть хоча б один відрізок із довжиною та кількістю.'); return; }

// === 2D-раскрой: алгоритм shelf (FFDH с поворотом) ===
// Сортируем детали по убыванию большей стороны, кладём построчно (полками).
// Каждую деталь пробуем как есть и повёрнутую на 90° — выбираем лучший вариант.

function pack2dShelf(piecesIn, sheetW, sheetH, kerf) {
    const items = [];
    let nid = 0;
    piecesIn.forEach((p, ci) => {
        const w = p.w | 0, h = p.h | 0, qty = p.qty | 0;
        if (w <= 0 || h <= 0 || qty <= 0) return;
        for (let q = 0; q < qty; q++) items.push({ id: nid++, w, h, srcIdx: ci });
    });
    if (items.length === 0) return { error: 'Не задано жодної деталі.', sheets: [] };

    const unplaced = [], placeable = [];
    for (const it of items) {
        const fitsAsIs = it.w <= sheetW && it.h <= sheetH;
        const fitsRot = it.h <= sheetW && it.w <= sheetH;
        if (!fitsAsIs && !fitsRot) unplaced.push(it); else placeable.push(it);
    }

    placeable.sort((a, b) => Math.max(b.w, b.h) - Math.max(a.w, a.h) || (b.w * b.h - a.w * a.h));

    const sheets = [];
    for (const it of placeable) {
        let placed = false;
        for (const sh of sheets) {
            if (placeOnSheet(sh, it, sheetW, sheetH, kerf)) { placed = true; break; }
        }
        if (!placed) {
            const ns = { shelves: [], placements: [] };
            placeOnSheet(ns, it, sheetW, sheetH, kerf);
            sheets.push(ns);
        }
    }
    return { sheets, unplaced, sheetW, sheetH, kerf };
}

function placeOnSheet(sh, it, sheetW, sheetH, kerf) {
    // Перебираем существующие полки, пробуем как есть и повёрнутую
    const orient = (w, h) => ({ w, h });
    const cands = [orient(it.w, it.h)];
    if (it.w !== it.h) cands.push(orient(it.h, it.w));

    for (const c of cands) {
        for (const shelf of sh.shelves) {
            if (c.h <= shelf.height && shelf.usedW + c.w + (shelf.usedW > 0 ? kerf : 0) <= sheetW) {
                const x = shelf.usedW + (shelf.usedW > 0 ? kerf : 0);
                sh.placements.push({ x, y: shelf.y, w: c.w, h: c.h, srcIdx: it.srcIdx, rot: c.w !== it.w });
                shelf.usedW = x + c.w;
                return true;
            }
        }
    }
    // Новая полка
    const yNext = sh.shelves.length ? sh.shelves[sh.shelves.length - 1].y + sh.shelves[sh.shelves.length - 1].height + kerf : 0;
    for (const c of cands) {
        if (yNext + c.h <= sheetH && c.w <= sheetW) {
            sh.shelves.push({ y: yNext, height: c.h, usedW: c.w });
            sh.placements.push({ x: 0, y: yNext, w: c.w, h: c.h, srcIdx: it.srcIdx, rot: c.w !== it.w });
            return true;
        }
    }
    return false;
}

function calcSheetMetrics(sheet, kerf) {
    // Кол-во врезок = кол-во деталей. Длина реза = сумма периметров.
    const pierces = sheet.placements.length;
    const cutLen = sheet.placements.reduce((s, p) => s + 2 * (p.w + p.h), 0);
    const used = sheet.placements.reduce((s, p) => s + p.w * p.h, 0);
    return { pierces, cutLen, used };
}

// === Рендер карты листового раскроя ===
function renderSheetSvg(sheet, sheetW, sheetH) {
    const palette = ['#bfdbfe','#a7f3d0','#fde68a','#fbcfe8','#c7d2fe','#fed7aa','#bae6fd','#d9f99d','#fecaca','#e9d5ff'];
    // Если лист «портретный» (выше, чем шире) — поворачиваем визуально на 90°,
    // чтобы длинная сторона была горизонталью. Пропорции сохраняем.
    const isPortrait = sheetH > sheetW;
    const dispW = isPortrait ? sheetH : sheetW;
    const dispH = isPortrait ? sheetW : sheetH;

    let svg = `<svg viewBox="0 0 ${dispW} ${dispH}" class="sheet-svg" style="aspect-ratio:${dispW}/${dispH};" preserveAspectRatio="xMidYMid meet">`;
    svg += `<rect x="0" y="0" width="${dispW}" height="${dispH}" fill="#fff" stroke="#9ca3af" stroke-width="4"/>`;
    sheet.placements.forEach(p => {
        const fill = palette[p.srcIdx % palette.length];
        let x, y, w, h;
        if (isPortrait) {
            // Транспонуємо: (px,py,pw,ph) → (py,px,ph,pw).
            // Так лівий-верхній кут заготовки залишається в лівому-верхньому куті показу.
            x = p.y;
            y = p.x;
            w = p.h;
            h = p.w;
        } else {
            x = p.x; y = p.y; w = p.w; h = p.h;
        }
        svg += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="#1f2937" stroke-width="3"/>`;
        const fs = Math.max(28, Math.min(w, h) / 4.5);
        const label = `${p.w}×${p.h}${p.rot ? ' ↻' : ''}`;
        svg += `<text x="${x + w/2}" y="${y + h/2}" text-anchor="middle" dominant-baseline="central" font-size="${fs}" font-family="system-ui" font-weight="600" fill="#111">${label}</text>`;
    });
    svg += `</svg>`;
    return svg;
}

function renderResultSheet(report) {
    const root = document.getElementById('resultSheet');
    if (!report) { root.classList.remove('show'); root.innerHTML = ''; return; }
    const dateStr = new Date().toLocaleDateString('uk-UA');

    let totalSheets = 0, totalPierces = 0, totalCutLen = 0, totalArea = 0, totalUsed = 0;
    report.results.forEach(entry => {
        const r = entry.r;
        if (r.error || !r.sheets) return;
        entry.metrics = r.sheets.map(s => calcSheetMetrics(s, r.kerf));
        entry.pierces = entry.metrics.reduce((s, m) => s + m.pierces, 0);
        entry.cutLen = entry.metrics.reduce((s, m) => s + m.cutLen, 0);
        entry.cost = entry.pierces * (state.piercePrice || 0) + (entry.cutLen / 1000) * (state.cutMeterPrice || 0);
        totalSheets += r.sheets.length;
        totalPierces += entry.pierces;
        totalCutLen += entry.cutLen;
        totalArea += r.sheets.length * r.sheetW * r.sheetH;
        totalUsed += entry.metrics.reduce((s, m) => s + m.used, 0);
    });
    const totalCost = report.results.reduce((s, x) => s + (x.cost || 0), 0);
    const usedPct = totalArea > 0 ? totalUsed / totalArea * 100 : 0;

    let html = '';
    html += `<div class="print-header wh-print-header">
        <div class="meta">Замовлення: <b>${esc(state.orderSheet) || '—'}</b> · Дата: ${dateStr}</div>
    </div>`;

    html += `<div class="card order-summary"><h2 class="no-print">Зведення по замовленню</h2>
        <div class="summary">
            <div class="stat"><div class="k">Номенклатур</div><div class="v">${report.results.length}</div></div>
            <div class="stat"><div class="k">Листів всього</div><div class="v">${totalSheets}</div></div>
            <div class="stat good"><div class="k">У деталях</div><div class="v">${pct(usedPct)}</div></div>
            <div class="stat"><div class="k">Врізок</div><div class="v">${totalPierces}</div></div>
            <div class="stat"><div class="k">Довжина різу</div><div class="v">${(totalCutLen/1000).toFixed(2)} м</div></div>
            <div class="stat cost"><div class="k">Вартість різів</div><div class="v">${fmtMoney(totalCost)}</div></div>
        </div>
    </div>`;

    report.results.forEach((entry, idx) => {
        const { profile: p, r } = entry;
        if (r.error) {
            html += `<div class="result-block"><div class="result-head"><span class="title">${esc(p.name) || 'Номенклатура №' + (idx+1)}</span><span class="meta">помилка</span></div><div class="result-body"><div class="unplaced">${esc(r.error)}</div></div></div>`;
            return;
        }
        const totalArea = r.sheets.length * r.sheetW * r.sheetH;
        const usedArea = entry.metrics.reduce((s, m) => s + m.used, 0);
        const usedP = totalArea > 0 ? usedArea / totalArea * 100 : 0;
        let bodyHtml = `<div class="summary">
            <div class="stat"><div class="k">Листів</div><div class="v">${r.sheets.length}</div></div>
            <div class="stat"><div class="k">Лист</div><div class="v">${r.sheetW}×${r.sheetH}</div></div>
            <div class="stat good"><div class="k">У деталях</div><div class="v">${pct(usedP)}</div></div>
            <div class="stat"><div class="k">Врізок</div><div class="v">${entry.pierces}</div></div>
            <div class="stat"><div class="k">Довжина різу</div><div class="v">${(entry.cutLen/1000).toFixed(2)} м</div></div>
            <div class="stat cost no-wh-print"><div class="k">Вартість різів</div><div class="v">${fmtMoney(entry.cost)}</div></div>
        </div>`;
        r.sheets.forEach((s, i) => {
            const m = entry.metrics[i];
            bodyHtml += `<div class="bar"><div class="bar-head"><span><b>Лист ${esc(p.name)}${p.thickness ? ' ' + p.thickness + 'мм' : ''} №${i+1}</b> · ${s.placements.length} дет.</span><span>врізок ${m.pierces} · різ ${(m.cutLen/1000).toFixed(2)} м</span></div>${renderSheetSvg(s, r.sheetW, r.sheetH)}</div>`;
        });
        if (r.unplaced && r.unplaced.length) {
            const list = r.unplaced.map(u => `${u.w}×${u.h}`).join(', ');
            bodyHtml += `<div class="unplaced"><b>Не вміщуються в лист ${r.sheetW}×${r.sheetH}:</b> ${r.unplaced.length} шт. — ${list}</div>`;
        }
        html += `<div class="result-block">
            <div class="result-head" data-block-toggle>
                <span class="caret">−</span>
                <span class="title">${esc(p.name) || 'Номенклатура №' + (idx+1)}${p.thickness ? ' · ' + p.thickness + ' мм' : ''}</span>
                <span class="badge">${r.sheets.length} ${pluralSheets(r.sheets.length)}</span>
                <span class="meta">${r.sheetW}×${r.sheetH} · ${r.sheets.reduce((s,x)=>s+x.placements.length,0)} дет.</span>
            </div>
            <div class="result-body">${bodyHtml}</div>
        </div>`;
    });

    html += `<div class="footer-act no-print">
        <button class="btn primary" id="btnPrintWhSheet">🖨 Карта розкрою (склад)</button>
        <button class="btn ghost" id="btnHideSheet">Сховати</button>
    </div>`;

    root.classList.add('show');
    root.innerHTML = html;
    root.addEventListener('click', e => {
        const head = e.target.closest('[data-block-toggle]');
        if (!head) return;
        const body = head.parentElement.querySelector('.result-body');
        const caret = head.querySelector('.caret');
        const hide = !body.classList.contains('hidden');
        body.classList.toggle('hidden', hide);
        if (caret) caret.textContent = hide ? '+' : '−';
    });
    document.getElementById('btnPrintWhSheet').addEventListener('click', () => { document.body.classList.remove('print-client'); window.print(); });
    document.getElementById('btnHideSheet').addEventListener('click', () => { root.classList.remove('show'); root.innerHTML = ''; window.scrollTo({ top: 0, behavior: 'smooth' }); });
}

function pluralSheets(n) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 'лист';
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'листи';
    return 'листів';
}

document.getElementById('btnCalcSheet').addEventListener('click', () => {
    if (!state.sheets.length) { alert('Додайте хоча б одну номенклатуру.'); return; }
    const valid = state.sheets.filter(s => s.pieces.some(c => (c.w|0) > 0 && (c.h|0) > 0 && (c.qty|0) > 0));
    if (!valid.length) { alert('Заповніть хоча б одну деталь з розмірами та кількістю.'); return; }
    const noThickness = state.sheets.filter(s => !((+s.thickness) > 0));
    if (noThickness.length) { alert('Вкажіть товщину листа для кожної номенклатури (обов\'язковий параметр).'); return; }

    const results = state.sheets.map(s => ({
        profile: s,
        r: (s.sheetW > 0 && s.sheetH > 0)
            ? pack2dShelf(s.pieces, s.sheetW, s.sheetH, state.kerfSheet)
            : { error: 'Не задано розмір листа', sheets: [] },
    }));
    state.resultSheet = { results };
    renderResultSheet(state.resultSheet);
    setTimeout(() => document.getElementById('resultSheet').scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
});

// === Init ===
load();
if (state.profiles.length === 0) state.profiles.push(newProfile('', 12000));
if (state.sheets.length === 0) state.sheets.push(newSheet('', 1500, 6000));
applyStateToUI();
renderProfiles();
renderSheets();
