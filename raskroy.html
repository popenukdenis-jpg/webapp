<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Раскрой металлопроката</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #1f2937; }
body { padding: 16px; max-width: 1100px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px 0; }
h2 { font-size: 15px; margin: 0 0 10px 0; color: #374151; text-transform: uppercase; letter-spacing: 0.5px; }
.sub { color: #6b7280; font-size: 13px; margin-bottom: 18px; }

.card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }

.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: #6b7280; }
.field input[type=text], .field input[type=number] {
    padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px;
    font-size: 14px; font-family: inherit; min-width: 80px;
}
.field input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }

.toggle { display: inline-flex; border: 1px solid #d1d5db; border-radius: 6px; overflow: hidden; }
.toggle button {
    padding: 7px 14px; border: none; background: #fff; cursor: pointer;
    font-size: 14px; font-family: inherit; color: #374151; border-right: 1px solid #d1d5db;
}
.toggle button:last-child { border-right: none; }
.toggle button.active { background: #3b82f6; color: #fff; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #f1f3f5; }
th { font-weight: 600; font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.3px; }
td input { width: 100%; padding: 5px 7px; border: 1px solid transparent; border-radius: 4px; font-size: 14px; font-family: inherit; background: transparent; }
td input:hover { border-color: #e5e7eb; }
td input:focus { outline: none; border-color: #3b82f6; background: #fff; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
td.num input { text-align: right; font-variant-numeric: tabular-nums; }
td.act { width: 32px; text-align: center; }
.del { background: none; border: none; cursor: pointer; color: #ef4444; font-size: 16px; padding: 2px 6px; border-radius: 4px; }
.del:hover { background: #fee2e2; }

.btn { padding: 8px 14px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; font-size: 14px; font-family: inherit; color: #374151; }
.btn:hover { background: #f9fafb; }
.btn.primary { background: #3b82f6; color: #fff; border-color: #3b82f6; }
.btn.primary:hover { background: #2563eb; }
.btn.big { padding: 12px 22px; font-size: 16px; font-weight: 600; }
.btn.ghost { background: transparent; border-color: transparent; color: #3b82f6; }
.btn.ghost:hover { background: #eff6ff; }

.toolbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

#result { display: none; }
#result.show { display: block; }

.summary { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; }
.stat { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px 14px; }
.stat .k { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.4px; }
.stat .v { font-size: 18px; font-weight: 600; color: #111827; font-variant-numeric: tabular-nums; }
.stat.good .v { color: #059669; }
.stat.warn .v { color: #d97706; }
.stat.bad .v { color: #dc2626; }

.bar { margin: 14px 0; }
.bar-head { display: flex; justify-content: space-between; font-size: 13px; color: #374151; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.bar-svg { width: 100%; height: 44px; display: block; }
.bar-svg rect.cut { stroke: #1f2937; stroke-width: 1; }
.bar-svg rect.tail-rem { fill: #fde68a; stroke: #b45309; stroke-width: 1; }
.bar-svg rect.tail-waste { fill: #fecaca; stroke: #b91c1c; stroke-width: 1; }
.bar-svg text { font-size: 11px; font-family: system-ui; fill: #111827; pointer-events: none; }

.unplaced { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 10px 14px; border-radius: 6px; margin-top: 10px; font-size: 13px; }

.legend { display: flex; gap: 14px; font-size: 12px; color: #6b7280; margin-top: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: middle; margin-right: 4px; border: 1px solid rgba(0,0,0,0.15); }

.footer-act { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

@media print {
    body { background: #fff; padding: 0; max-width: none; }
    .card.no-print, .toolbar.no-print, .footer-act, header .no-print { display: none !important; }
    #result { display: block !important; }
    .bar { page-break-inside: avoid; }
    .card { box-shadow: none; border: none; padding: 0; margin-bottom: 8px; }
    h1 { font-size: 16px; }
    .stat { background: #fff; }
    .print-header { display: block !important; border-bottom: 2px solid #111; margin-bottom: 12px; padding-bottom: 6px; }
}
.print-header { display: none; }
.print-header h1 { margin-bottom: 2px; }
.print-header .meta { font-size: 12px; color: #374151; }
</style>
</head>
<body>

<header>
    <h1>Раскрой металлопроката</h1>
    <div class="sub">Линейный 1D-раскрой с минимизацией отходов · карта реза для склада</div>
</header>

<div class="card no-print">
    <h2>Заказ</h2>
    <div class="row">
        <div class="field" style="flex:1; min-width: 240px;">
            <label>Профиль / номенклатура</label>
            <input type="text" id="fProfile" placeholder="напр. Арматура Ø12 А500С">
        </div>
        <div class="field">
            <label>№ заказа</label>
            <input type="text" id="fOrder" placeholder="ЗМ-00123">
        </div>
        <div class="field">
            <label>Длина заготовки (хлыста)</label>
            <div class="toggle" id="lenToggle">
                <button data-len="6000">6 м</button>
                <button data-len="12000" class="active">12 м</button>
                <button data-len="custom">другое</button>
            </div>
        </div>
        <div class="field" id="customLenWrap" style="display:none;">
            <label>мм</label>
            <input type="number" id="fCustomLen" min="100" step="1" value="11700">
        </div>
    </div>
    <div class="row" style="margin-top:12px;">
        <div class="field">
            <label>Ширина реза (kerf), мм</label>
            <input type="number" id="fKerf" min="0" step="0.5" value="3">
        </div>
        <div class="field">
            <label>Мин. деловой обрезок, мм</label>
            <input type="number" id="fMinRem" min="0" step="10" value="300">
        </div>
    </div>
</div>

<div class="card no-print">
    <h2>Отрезки</h2>
    <table id="cutsTable">
        <thead>
            <tr>
                <th style="width:40px;">№</th>
                <th>Длина, мм</th>
                <th>Кол-во</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="cutsBody"></tbody>
    </table>
    <div class="toolbar">
        <button class="btn" id="btnAddCut">+ строка</button>
        <button class="btn ghost" id="btnPreset">Пример</button>
        <button class="btn ghost" id="btnClearCuts">Очистить</button>
    </div>
</div>

<div class="card no-print" style="text-align:center;">
    <button class="btn primary big" id="btnCalc">Рассчитать карту раскроя</button>
</div>

<div id="result"></div>

<script>
// === Состояние ===
const state = {
    profile: '',
    order: '',
    barLen: 12000,
    kerf: 3,
    minRem: 300,
    cuts: [],   // [{length, qty, mark}]
    result: null,
};

const STORAGE_KEY = 'raskroy.v1';

function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({
        profile: state.profile, order: state.order, barLen: state.barLen,
        kerf: state.kerf, minRem: state.minRem, cuts: state.cuts,
    })); } catch (e) {}
}
function load() {
    try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (s) Object.assign(state, s);
    } catch (e) {}
}

// === Отрезки: рендер таблицы ===
function renderCuts() {
    const tb = document.getElementById('cutsBody');
    tb.innerHTML = '';
    state.cuts.forEach((c, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td style="color:#6b7280; font-variant-numeric:tabular-nums;">${i + 1}</td>
            <td class="num"><input type="number" min="1" step="1" value="${c.length || ''}" data-i="${i}" data-k="length"></td>
            <td class="num"><input type="number" min="1" step="1" value="${c.qty || ''}" data-i="${i}" data-k="qty"></td>
            <td class="act"><button class="del" data-del="${i}" title="Удалить">✕</button></td>
        `;
        tb.appendChild(tr);
    });
    if (state.cuts.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="4" style="color:#9ca3af; text-align:center; padding: 16px;">Добавьте строки кнопкой ниже</td>`;
        tb.appendChild(tr);
    }
}

document.getElementById('cutsBody').addEventListener('input', e => {
    const inp = e.target;
    if (!inp.dataset.k) return;
    const i = +inp.dataset.i, k = inp.dataset.k;
    state.cuts[i][k] = (k === 'mark') ? inp.value : (parseInt(inp.value, 10) || 0);
    save();
});
document.getElementById('cutsBody').addEventListener('click', e => {
    const b = e.target.closest('[data-del]');
    if (!b) return;
    state.cuts.splice(+b.dataset.del, 1);
    renderCuts(); save();
});

document.getElementById('btnAddCut').addEventListener('click', () => {
    state.cuts.push({ length: 0, qty: 1, mark: '' });
    renderCuts(); save();
});
document.getElementById('btnClearCuts').addEventListener('click', () => {
    if (!state.cuts.length || confirm('Очистить все строки?')) {
        state.cuts = []; renderCuts(); save();
    }
});
document.getElementById('btnPreset').addEventListener('click', () => {
    state.cuts = [
        { length: 2400, qty: 12, mark: 'БМ-1 верх' },
        { length: 1800, qty: 8,  mark: 'СТ-1 стойка' },
        { length: 1500, qty: 14, mark: 'СТ-2 стойка' },
        { length: 950,  qty: 20, mark: 'РК-1 раскос' },
        { length: 600,  qty: 16, mark: 'УЗ-1 узел' },
    ];
    state.profile = state.profile || 'Профтруба 40×40×2';
    document.getElementById('fProfile').value = state.profile;
    renderCuts(); save();
});

// === Параметры заказа ===
const fProfile = document.getElementById('fProfile');
const fOrder = document.getElementById('fOrder');
const fKerf = document.getElementById('fKerf');
const fMinRem = document.getElementById('fMinRem');
const fCustomLen = document.getElementById('fCustomLen');
const customLenWrap = document.getElementById('customLenWrap');
const lenToggle = document.getElementById('lenToggle');

fProfile.addEventListener('input', () => { state.profile = fProfile.value; save(); });
fOrder.addEventListener('input', () => { state.order = fOrder.value; save(); });
fKerf.addEventListener('input', () => { state.kerf = parseFloat(fKerf.value) || 0; save(); });
fMinRem.addEventListener('input', () => { state.minRem = parseInt(fMinRem.value, 10) || 0; save(); });
fCustomLen.addEventListener('input', () => {
    const v = parseInt(fCustomLen.value, 10) || 0;
    if (v > 0) { state.barLen = v; save(); }
});

lenToggle.addEventListener('click', e => {
    const b = e.target.closest('button[data-len]');
    if (!b) return;
    [...lenToggle.children].forEach(c => c.classList.remove('active'));
    b.classList.add('active');
    if (b.dataset.len === 'custom') {
        customLenWrap.style.display = '';
        state.barLen = parseInt(fCustomLen.value, 10) || 11700;
    } else {
        customLenWrap.style.display = 'none';
        state.barLen = parseInt(b.dataset.len, 10);
    }
    save();
});

function applyStateToUI() {
    fProfile.value = state.profile || '';
    fOrder.value = state.order || '';
    fKerf.value = state.kerf;
    fMinRem.value = state.minRem;
    // toggle
    [...lenToggle.children].forEach(c => c.classList.remove('active'));
    if (state.barLen === 6000) {
        lenToggle.querySelector('[data-len="6000"]').classList.add('active');
        customLenWrap.style.display = 'none';
    } else if (state.barLen === 12000) {
        lenToggle.querySelector('[data-len="12000"]').classList.add('active');
        customLenWrap.style.display = 'none';
    } else {
        lenToggle.querySelector('[data-len="custom"]').classList.add('active');
        customLenWrap.style.display = '';
        fCustomLen.value = state.barLen;
    }
}

// === Оптимизатор ===
// Алгоритм: «best pattern next» — на каждой итерации находим оптимальное
// заполнение одной заготовки через 0/1-knapsack DP по длине.
// Хитрость с резом (kerf): к каждому отрезку добавляем kerf, к ёмкости тоже +kerf —
// так n отрезков на одной заготовке корректно учитывают (n-1) резов между ними.

function bestPattern(items, capacity) {
    const n = items.length;
    const cap = capacity | 0;
    if (n === 0 || cap <= 0) return { picks: [], sum: 0 };
    const dp = new Int32Array(cap + 1);
    const take = new Uint8Array(n * (cap + 1));
    for (let i = 0; i < n; i++) {
        const w = items[i].w;
        if (w > cap) continue;
        const off = i * (cap + 1);
        for (let c = cap; c >= w; c--) {
            const v = dp[c - w] + w;
            if (v > dp[c]) { dp[c] = v; take[off + c] = 1; }
        }
    }
    let bestC = 0, bestV = 0;
    for (let c = 0; c <= cap; c++) if (dp[c] > bestV) { bestV = dp[c]; bestC = c; }
    let c = bestC;
    const picks = [];
    for (let i = n - 1; i >= 0; i--) {
        if (take[i * (cap + 1) + c]) { picks.push(i); c -= items[i].w; }
    }
    return { picks, sum: bestV };
}

function optimize(cuts, barLen, kerf, minRem) {
    const items = [];
    let nid = 0;
    cuts.forEach((c, ci) => {
        const len = c.length | 0, qty = c.qty | 0;
        if (len <= 0 || qty <= 0) return;
        for (let q = 0; q < qty; q++) items.push({ id: nid++, len, mark: c.mark || '', srcIdx: ci });
    });
    if (items.length > 1500) return { error: `Слишком много отрезков (${items.length}). Лимит 1500 — разбейте на части.` };
    if (items.length === 0) return { error: 'Не задано ни одного отрезка с длиной и количеством.' };

    const placeable = [], unplaced = [];
    for (const it of items) (it.len > barLen ? unplaced : placeable).push(it);

    const bars = [];
    let remaining = placeable.slice();
    const cap = (barLen + kerf) | 0;
    let safety = remaining.length + 5;

    while (remaining.length > 0 && safety-- > 0) {
        const dpItems = remaining.map((it, idx) => ({ idx, w: (it.len + kerf) | 0 }));
        const pat = bestPattern(dpItems, cap);
        if (pat.picks.length === 0) break;
        const placedSet = new Set(pat.picks);
        const placed = pat.picks.map(i => remaining[i]).sort((a, b) => b.len - a.len);
        const cutsLen = placed.reduce((s, it) => s + it.len, 0);
        const kerfTot = Math.max(0, placed.length - 1) * kerf;
        const tail = Math.max(0, barLen - cutsLen - kerfTot);
        bars.push({ cuts: placed, usedLen: cutsLen, kerfTotal: kerfTot, tail, isRemnant: tail >= minRem });
        remaining = remaining.filter((_, idx) => !placedSet.has(idx));
    }

    const totalBarsLen = bars.length * barLen;
    const totalCutsLen = bars.reduce((s, b) => s + b.usedLen, 0);
    const totalKerf = bars.reduce((s, b) => s + b.kerfTotal, 0);
    const totalRemnant = bars.filter(b => b.isRemnant).reduce((s, b) => s + b.tail, 0);
    const totalWaste = bars.filter(b => !b.isRemnant).reduce((s, b) => s + b.tail, 0) + totalKerf;

    return { bars, unplaced, totalBarsLen, totalCutsLen, totalKerf, totalRemnant, totalWaste, barLen, kerf, minRem };
}

// === Утилиты ===
function esc(s) { return String(s ?? '').replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMm(mm) { return mm >= 1000 ? (mm / 1000).toFixed(2).replace(/\.?0+$/, '') + ' м' : Math.round(mm) + ' мм'; }
function pct(p) { return p.toFixed(1) + '%'; }

// === Рендер результата ===
function renderResult(r) {
    const root = document.getElementById('result');
    if (!r) { root.classList.remove('show'); root.innerHTML = ''; return; }
    if (r.error) {
        root.classList.add('show');
        root.innerHTML = `<div class="card"><div class="unplaced">${r.error}</div></div>`;
        return;
    }
    const wastePct = r.totalBarsLen > 0 ? (r.totalWaste / r.totalBarsLen * 100) : 0;
    const usedPct  = r.totalBarsLen > 0 ? (r.totalCutsLen / r.totalBarsLen * 100) : 0;
    const dateStr = new Date().toLocaleDateString('ru-RU');

    let html = '';
    html += `<div class="print-header">
        <h1>Карта раскроя</h1>
        <div class="meta">Профиль: <b>${esc(state.profile) || '—'}</b> · Заказ: <b>${esc(state.order) || '—'}</b> · Заготовка: <b>${fmtMm(r.barLen)}</b> · Рез: ${r.kerf} мм · Дата: ${dateStr}</div>
    </div>`;

    html += `<div class="card"><h2 class="no-print">Итог</h2>
        <div class="summary">
            <div class="stat"><div class="k">Хлыстов</div><div class="v">${r.bars.length}</div></div>
            <div class="stat"><div class="k">Длина металла</div><div class="v">${fmtMm(r.totalBarsLen)}</div></div>
            <div class="stat good"><div class="k">В деталях</div><div class="v">${pct(usedPct)}</div></div>
            <div class="stat warn"><div class="k">Обрезки на склад</div><div class="v">${fmtMm(r.totalRemnant)}</div></div>
            <div class="stat bad"><div class="k">Отходы (с резом)</div><div class="v">${pct(wastePct)}</div></div>
        </div>
        <div class="legend no-print">
            <span><i style="background:#bfdbfe;border-color:#1d4ed8;"></i>отрез</span>
            <span><i style="background:#fde68a;border-color:#b45309;"></i>деловой обрезок ≥ ${r.minRem} мм</span>
            <span><i style="background:#fecaca;border-color:#b91c1c;"></i>отход</span>
            <span><i style="background:#374151;border-color:#374151;"></i>пропил (${r.kerf} мм)</span>
        </div>
    </div>`;

    html += `<div class="card"><h2 class="no-print">Карта реза</h2>`;
    r.bars.forEach((b, i) => { html += renderBarSvg(b, i + 1, r.barLen, r.kerf); });
    html += `</div>`;

    if (r.unplaced.length) {
        const list = r.unplaced.map(u => `${u.len} мм${u.mark ? ` (${esc(u.mark)})` : ''}`).join(', ');
        html += `<div class="card"><div class="unplaced"><b>Не помещаются в заготовку ${fmtMm(r.barLen)}:</b> ${r.unplaced.length} шт. — ${list}</div></div>`;
    }

    html += `<div class="footer-act no-print">
        <button class="btn primary" id="btnPrint">🖨 Печать карты</button>
        <button class="btn" id="btnCsv">Экспорт CSV</button>
        <button class="btn ghost" id="btnHide">Скрыть</button>
    </div>`;

    root.classList.add('show');
    root.innerHTML = html;
    document.getElementById('btnPrint').addEventListener('click', () => window.print());
    document.getElementById('btnCsv').addEventListener('click', () => exportCsv(r));
    document.getElementById('btnHide').addEventListener('click', () => {
        root.classList.remove('show'); root.innerHTML = ''; window.scrollTo({ top: 0, behavior: 'smooth' });
    });
}

function renderBarSvg(b, num, barLen, kerf) {
    const W = 1000, H = 38;
    const scale = W / barLen;
    const palette = ['#bfdbfe','#a7f3d0','#fde68a','#fbcfe8','#c7d2fe','#fed7aa','#bae6fd','#d9f99d','#fecaca','#e9d5ff'];
    const colorByKey = new Map();
    let ci = 0;
    let x = 0;
    let svg = `<svg class="bar-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
    svg += `<rect x="0" y="2" width="${W}" height="${H - 4}" fill="#fff" stroke="#9ca3af"/>`;
    b.cuts.forEach((c, idx) => {
        const w = c.len * scale;
        const key = c.mark || ('L' + c.len);
        if (!colorByKey.has(key)) { colorByKey.set(key, palette[ci % palette.length]); ci++; }
        const fill = colorByKey.get(key);
        svg += `<rect class="cut" x="${x.toFixed(2)}" y="2" width="${w.toFixed(2)}" height="${H - 4}" fill="${fill}"/>`;
        if (w > 30) svg += `<text x="${(x + w / 2).toFixed(2)}" y="${(H / 2 + 4).toFixed(2)}" text-anchor="middle">${c.len}</text>`;
        x += w;
        if (idx < b.cuts.length - 1 && kerf > 0) {
            const kw = Math.max(0.6, kerf * scale);
            svg += `<rect x="${x.toFixed(2)}" y="2" width="${kw.toFixed(2)}" height="${H - 4}" fill="#374151"/>`;
            x += kw;
        }
    });
    if (b.tail > 0) {
        const tw = b.tail * scale;
        svg += `<rect class="${b.isRemnant ? 'tail-rem' : 'tail-waste'}" x="${x.toFixed(2)}" y="2" width="${tw.toFixed(2)}" height="${H - 4}"/>`;
        if (tw > 32) svg += `<text x="${(x + tw / 2).toFixed(2)}" y="${(H / 2 + 4).toFixed(2)}" text-anchor="middle">${Math.round(b.tail)}</text>`;
    }
    svg += `</svg>`;

    const tailLabel = b.tail <= 0 ? 'без остатка'
        : (b.isRemnant ? `обрезок ${Math.round(b.tail)} мм → склад` : `отход ${Math.round(b.tail)} мм`);
    return `<div class="bar">
        <div class="bar-head">
            <span><b>Хлыст #${num}</b> · ${b.cuts.length} отр.</span>
            <span>${tailLabel}</span>
        </div>
        ${svg}
    </div>`;
}

function exportCsv(r) {
    const rows = [];
    rows.push(['Профиль', state.profile || '']);
    rows.push(['Заказ', state.order || '']);
    rows.push(['Заготовка, мм', r.barLen]);
    rows.push(['Рез, мм', r.kerf]);
    rows.push(['Мин. обрезок, мм', r.minRem]);
    rows.push([]);
    rows.push(['Хлыст №', 'Отрез №', 'Длина, мм', 'Маркировка']);
    r.bars.forEach((b, i) => {
        b.cuts.forEach((c, j) => rows.push([i + 1, j + 1, c.len, c.mark || '']));
        rows.push([i + 1, '', '— остаток —', `${Math.round(b.tail)} мм ${b.isRemnant ? '(деловой)' : '(отход)'}`]);
    });
    rows.push([]);
    rows.push(['ИТОГО хлыстов', r.bars.length]);
    rows.push(['Общая длина, мм', r.totalBarsLen]);
    rows.push(['В деталях, мм', r.totalCutsLen]);
    rows.push(['Деловых обрезков, мм', r.totalRemnant]);
    rows.push(['Отходов (с резом), мм', r.totalWaste]);
    const csv = rows.map(row => row.map(v => {
        const s = String(v ?? '');
        return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }).join(';')).join('\r\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const name = (state.order || 'order').replace(/[^\w\-А-Яа-яЁё]/g, '_');
    a.href = url; a.download = `raskroy_${name}_${Date.now()}.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
}

document.getElementById('btnCalc').addEventListener('click', () => {
    if (!state.cuts.some(c => (c.length | 0) > 0 && (c.qty | 0) > 0)) {
        alert('Добавьте хотя бы один отрезок с длиной и количеством.'); return;
    }
    if (!(state.barLen > 0)) { alert('Укажите длину заготовки.'); return; }
    const r = optimize(state.cuts, state.barLen, state.kerf, state.minRem);
    state.result = r;
    renderResult(r);
    setTimeout(() => document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
});

// === Init ===
load();
applyStateToUI();
renderCuts();
</script>
</body>
