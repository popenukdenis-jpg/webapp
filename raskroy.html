<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КТ-СТАЛЬ · Раскрой металлопроката</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0d0d0d; color: #1f2937; }
body { padding: 0; max-width: none; margin: 0; }
.page { padding: 16px; max-width: 1100px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px 0; }
h2 { font-size: 15px; margin: 0 0 10px 0; color: #374151; text-transform: uppercase; letter-spacing: 0.5px; }
.sub { color: #6b7280; font-size: 13px; margin-bottom: 18px; }

.brand { background: #0d0d0d; color: #fff; padding: 14px 28px; display: flex; align-items: center; gap: 16px; border-bottom: 4px solid #F5C518; }
.brand .logo { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; }
.brand .logo-icon { width: 38px; height: 38px; flex: 0 0 auto; }
.brand .logo-name { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: 1.5px; }
.brand .divider { width: 1px; height: 28px; background: #2a2a2a; margin: 0 4px; }
.brand .app-name { font-size: 13px; color: #d1d5db; text-transform: uppercase; letter-spacing: 1.5px; }
.brand .spacer { flex: 1; }
.brand .slogan { font-size: 12px; color: #9ca3af; line-height: 1.4; text-align: right; }
.brand .slogan b { color: #F5C518; font-weight: 600; }
@media (max-width: 720px) {
    .brand { padding: 10px 14px; gap: 10px; flex-wrap: wrap; }
    .brand .slogan { display: none; }
    .brand .app-name { font-size: 12px; }
}

.card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }

.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: #6b7280; }
.field input[type=text], .field input[type=number] {
    padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px;
    font-size: 14px; font-family: inherit; min-width: 80px;
}
.field input:focus { outline: none; border-color: #F5C518; box-shadow: 0 0 0 3px rgba(245,197,24,0.25); }

.toggle { display: inline-flex; border: 1px solid #d1d5db; border-radius: 6px; overflow: hidden; }
.toggle button {
    padding: 7px 14px; border: none; background: #fff; cursor: pointer;
    font-size: 14px; font-family: inherit; color: #374151; border-right: 1px solid #d1d5db;
}
.toggle button:last-child { border-right: none; }
.toggle button.active { background: #F5C518; color: #0d0d0d; font-weight: 600; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #f1f3f5; }
th { font-weight: 600; font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.3px; }
td input { width: 100%; padding: 5px 7px; border: 1px solid transparent; border-radius: 4px; font-size: 14px; font-family: inherit; background: transparent; }
td input:hover { border-color: #e5e7eb; }
td input:focus { outline: none; border-color: #F5C518; background: #fff; box-shadow: 0 0 0 2px rgba(245,197,24,0.25); }
td.num input { text-align: right; font-variant-numeric: tabular-nums; }
td.act { width: 32px; text-align: center; }
.del { background: none; border: none; cursor: pointer; color: #ef4444; font-size: 16px; padding: 2px 6px; border-radius: 4px; }
.del:hover { background: #fee2e2; }

.btn { padding: 8px 14px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; font-size: 14px; font-family: inherit; color: #374151; }
.btn:hover { background: #f9fafb; }
.btn.primary { background: #F5C518; color: #0d0d0d; border-color: #F5C518; font-weight: 600; }
.btn.primary:hover { background: #e0b414; border-color: #e0b414; }
.btn.big { padding: 12px 22px; font-size: 16px; font-weight: 600; }
.btn.ghost { background: transparent; border-color: transparent; color: #b8860b; }
.btn.ghost:hover { background: #fef9c3; }

.toolbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

#result { display: none; }
#result.show { display: block; }

.summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 14px; }
.stat { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px 10px; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; }
.stat .k { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.4px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v { font-size: 16px; font-weight: 600; color: #111827; font-variant-numeric: tabular-nums; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.good .v { color: #059669; }
.stat.warn .v { color: #d97706; }
.stat.bad .v { color: #dc2626; }
.stat input.price-input { width: 100%; padding: 2px 6px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 15px; font-weight: 600; font-family: inherit; font-variant-numeric: tabular-nums; color: #111827; background: #fff; box-sizing: border-box; }
.stat input.price-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
.stat.cost .v { color: #b8860b; }

.bar { margin: 14px 0; }
.bar-head { display: flex; justify-content: space-between; font-size: 13px; color: #374151; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.bar-svg { width: 100%; height: 26px; display: block; }
.bar-svg rect.cut { stroke: #1f2937; stroke-width: 1; }
.bar-svg rect.tail-rem { fill: #fde68a; stroke: #b45309; stroke-width: 1; }
.bar-svg rect.tail-waste { fill: #fecaca; stroke: #b91c1c; stroke-width: 1; }
.bar-svg text { font-size: 17px; font-weight: 600; font-family: system-ui; fill: #111827; pointer-events: none; }

.unplaced { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 10px 14px; border-radius: 6px; margin-top: 10px; font-size: 13px; }

.legend { display: flex; gap: 14px; font-size: 12px; color: #6b7280; margin-top: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: middle; margin-right: 4px; border: 1px solid rgba(0,0,0,0.15); }

.footer-act { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

@media print {
    body { background: #fff; padding: 0; max-width: none; }
    .no-print, header { display: none !important; }
    #result { display: block !important; }
    .bar { page-break-inside: avoid; break-inside: avoid; }
    .card, .result-block { box-shadow: none; border: none; padding: 0; margin-bottom: 8px; page-break-inside: avoid; break-inside: avoid; }
    .result-head, .cv-head { background: #fff !important; color: #111 !important; border-bottom: 2px solid #111 !important; padding: 4px 0; cursor: default; page-break-after: avoid; break-after: avoid; }
    .result-head .title, .cv-head .title { color: #111 !important; }
    .result-head .meta, .cv-head .meta { color: #555 !important; }
    .result-head .badge, .cv-head .badge { background: #111 !important; color: #fff !important; }
    .result-head .caret { display: none; }
    .result-body, .result-body.hidden { display: block !important; padding: 4px 0; }
    .summary { page-break-inside: avoid; break-inside: avoid; }
    h1 { font-size: 16px; }
    .stat { background: #fff; }
    .print-header { display: block !important; border-bottom: 2px solid #111; margin-bottom: 12px; padding-bottom: 6px; }

    /* Режим «для склада»: показываем только хлысты, прячем общую сводку и клиентскую */
    body:not(.print-client) .order-summary,
    body:not(.print-client) .client-view,
    body:not(.print-client) .wh-print-header { /* wh-print-header reserved */ }
    body:not(.print-client) .order-summary { display: none !important; }
    body:not(.print-client) .client-view { display: none !important; }

    /* Режим «для клиента»: общая сводка по заказу + клиентская табличка, без карты реза */
    body.print-client .result-block { display: none !important; }
    body.print-client .order-summary { display: block !important; }
    body.print-client .client-view { display: block !important; }
    body.print-client .wh-print-header { display: none !important; }

    /* В печати для склада не показываем цену и стоимость резов */
    body:not(.print-client) .no-wh-print { display: none !important; }
}
.print-header { display: none; }
.print-header h1 { margin-bottom: 2px; }
.print-header .meta { font-size: 12px; color: #374151; }

.client-view { display: none; }
.cv-block { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); overflow: hidden; page-break-inside: avoid; break-inside: avoid; }
.cv-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #0d0d0d; color: #fff; border-bottom: 3px solid #F5C518; }
.cv-head .title { font-weight: 700; font-size: 15px; color: #fff; letter-spacing: 0.3px; }
.cv-head .badge { background: #F5C518; color: #0d0d0d; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.cv-head .meta { font-size: 12px; color: #9ca3af; margin-left: auto; }
.cv-body { padding: 14px 16px; }
.cv-tbl { border-collapse: collapse; margin-top: 10px; }
.cv-tbl th, .cv-tbl td { border: 1px solid #d1d5db; padding: 6px 14px; font-size: 13px; }
.cv-tbl th { background: #f9fafb; font-weight: 600; color: #374151; text-transform: uppercase; letter-spacing: 0.3px; font-size: 11px; }
.cv-tbl td { text-align: right; font-variant-numeric: tabular-nums; }
.cv-tbl td:first-child { color: #6b7280; }
.cv-foot { margin-top: 14px; padding: 10px 14px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 13px; font-weight: 600; color: #111827; }

.nom-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); overflow: hidden; }
.nom-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; }
.nom-head .caret { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; color: #374151; font-size: 18px; font-weight: 700; line-height: 1; border: 1px solid #d1d5db; border-radius: 4px; background: #fff; flex: 0 0 auto; }
.nom-head .caret:hover { background: #f3f4f6; }
.nom-head .name-input { flex: 1; min-width: 220px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; font-family: inherit; background: #fff; }
.nom-head .name-input:focus { outline: none; border-color: #F5C518; box-shadow: 0 0 0 3px rgba(245,197,24,0.25); }
.nom-head .nom-meta { font-size: 12px; color: #6b7280; margin-right: auto; }
.nom-head .nom-del { background: none; border: none; cursor: pointer; color: #ef4444; font-size: 18px; padding: 4px 8px; border-radius: 4px; }
.nom-head .nom-del:hover { background: #fee2e2; }
.nom-body { padding: 12px 14px; }
.nom-body.hidden { display: none; }

.add-nom { display: flex; justify-content: center; margin: 4px 0 14px; }

.result-block { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); overflow: hidden; }
.result-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #0d0d0d; color: #fff; border-bottom: 3px solid #F5C518; cursor: pointer; user-select: none; }
.result-head .caret { color: #F5C518; font-size: 18px; font-weight: 700; line-height: 1; width: 22px; display: inline-flex; align-items: center; justify-content: center; }
.result-head .title { font-weight: 700; font-size: 15px; color: #fff; letter-spacing: 0.3px; }
.result-head .badge { background: #F5C518; color: #0d0d0d; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.result-head .meta { font-size: 12px; color: #9ca3af; margin-left: auto; }
.result-body { padding: 14px 16px; }
.result-body.hidden { display: none; }
</style>
</head>
<body>

<header class="brand no-print">
    <a class="logo" href="https://kt-stal.com.ua" target="_blank" rel="noopener">
        <svg class="logo-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <rect x="2"  y="26" width="10" height="10" rx="1" fill="#F5C518"/>
            <rect x="14" y="26" width="10" height="10" rx="1" fill="#F5C518"/>
            <rect x="26" y="26" width="10" height="10" rx="1" fill="#F5C518"/>
            <rect x="8"  y="14" width="10" height="10" rx="1" fill="#F5C518"/>
            <rect x="20" y="14" width="10" height="10" rx="1" fill="#F5C518"/>
            <rect x="14" y="2"  width="10" height="10" rx="1" fill="#F5C518"/>
        </svg>
        <span class="logo-name">КТ-СТАЛЬ</span>
    </a>
    <div class="divider"></div>
    <div class="app-name">Раскрой металлопроката</div>
    <div class="spacer"></div>
    <div class="slogan"><b>Продаж металопрокату</b><br>по всій Україні</div>
</header>

<div class="page">

<div class="card no-print">
    <h2>Заказ</h2>
    <div class="row">
        <div class="field">
            <label>№ заказа</label>
            <input type="text" id="fOrder" placeholder="ЗМ-00123">
        </div>
        <div class="field">
            <label>Ширина реза (kerf), мм</label>
            <input type="number" id="fKerf" min="0" step="0.5" placeholder="0">
        </div>
        <div class="field">
            <label>Мин. деловой обрезок, мм</label>
            <input type="number" id="fMinRem" min="0" step="10" placeholder="0">
        </div>
    </div>
</div>

<div id="profilesContainer" class="no-print"></div>

<div class="add-nom no-print">
    <button class="btn" id="btnAddProfile">+ Добавить номенклатуру</button>
</div>

<div class="card no-print" style="text-align:center;">
    <button class="btn primary big" id="btnCalc">Рассчитать карту раскроя</button>
</div>

<div id="result"></div>

</div><!-- /.page -->

<script>
// === Состояние ===
const state = {
    order: '',
    kerf: 0,
    minRem: 0,
    profiles: [],   // [{id, name, barLen, collapsed, cuts:[{length,qty}]}]
    result: null,
};

const STORAGE_KEY = 'raskroy.v3';
let nextProfId = 1;

function newProfile(name = '', barLen = 12000) {
    return { id: nextProfId++, name, barLen, cutPrice: 0, collapsed: false, cuts: [{ length: 0, qty: 0 }] };
}

function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({
        order: state.order, kerf: state.kerf, minRem: state.minRem, profiles: state.profiles,
    })); } catch (e) {}
}
function load() {
    try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (s && Array.isArray(s.profiles)) {
            state.order = s.order || '';
            state.kerf = s.kerf ?? 0;
            state.minRem = s.minRem ?? 0;
            state.profiles = s.profiles;
            for (const p of state.profiles) if (p.id >= nextProfId) nextProfId = p.id + 1;
            return;
        }
        // миграция со старых версий — переносим только профили и заказ, ширину реза/мин.остаток обнуляем
        const v2 = JSON.parse(localStorage.getItem('raskroy.v2') || 'null');
        if (v2 && Array.isArray(v2.profiles)) {
            state.order = v2.order || '';
            state.profiles = v2.profiles;
            for (const p of state.profiles) if (p.id >= nextProfId) nextProfId = p.id + 1;
            return;
        }
        const old = JSON.parse(localStorage.getItem('raskroy.v1') || 'null');
        if (old) {
            state.order = old.order || '';
            state.profiles = [{
                id: nextProfId++, name: old.profile || '', barLen: old.barLen || 12000,
                collapsed: false, cuts: old.cuts || [],
            }];
        }
    } catch (e) {}
}

// === Рендер блоков номенклатур ===
function profileHtml(p, idx) {
    const lenButtons = [6000, 12000].map(l =>
        `<button data-len="${l}" class="${p.barLen === l ? 'active' : ''}">${l / 1000} м</button>`
    ).join('') + `<button data-len="custom" class="${(p.barLen !== 6000 && p.barLen !== 12000) ? 'active' : ''}">другое</button>`;
    const isCustom = (p.barLen !== 6000 && p.barLen !== 12000);
    const rows = p.cuts.map((c, i) => `
        <tr>
            <td style="color:#6b7280; font-variant-numeric:tabular-nums; width:40px;">${i + 1}</td>
            <td class="num"><input type="number" min="1" step="1" value="${c.length || ''}" data-ci="${i}" data-k="length"></td>
            <td class="num"><input type="number" min="1" step="1" value="${c.qty || ''}" data-ci="${i}" data-k="qty"></td>
            <td class="act"><button class="del" data-del-cut="${i}" title="Удалить">✕</button></td>
        </tr>
    `).join('') || `<tr><td colspan="4" style="color:#9ca3af; text-align:center; padding:16px;">Добавьте строки кнопкой ниже</td></tr>`;

    const totalCuts = p.cuts.reduce((s, c) => s + ((c.length | 0) > 0 && (c.qty | 0) > 0 ? c.qty : 0), 0);

    return `<div class="nom-card" data-pid="${p.id}">
        <div class="nom-head">
            <span class="caret" data-toggle title="${p.collapsed ? 'Развернуть' : 'Свернуть'}">${p.collapsed ? '+' : '−'}</span>
            <input class="name-input" type="text" placeholder="Номенклатура (напр. Профтруба 40×40×2)" value="${esc(p.name)}" data-name>
            <span class="nom-meta">${totalCuts ? totalCuts + ' отр.' : '—'}</span>
            <div class="toggle" data-len-toggle>${lenButtons}</div>
            ${isCustom ? `<input type="number" min="100" step="1" value="${p.barLen}" data-custom-len style="width:90px; padding:6px 8px; border:1px solid #d1d5db; border-radius:6px;">` : ''}
            <button class="nom-del" data-del-prof title="Удалить номенклатуру">✕</button>
        </div>
        <div class="nom-body ${p.collapsed ? 'hidden' : ''}">
            <table>
                <thead><tr>
                    <th style="width:40px;">№</th><th>Длина, мм</th><th>Кол-во</th><th></th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
            <div class="toolbar">
                <button class="btn" data-add-cut>+ строка</button>
                <button class="btn ghost" data-clear-cuts>Очистить</button>
                <button class="btn ghost" data-toggle title="Свернуть блок" style="margin-left:auto;">− свернуть</button>
            </div>
        </div>
    </div>`;
}

function renderProfiles() {
    const root = document.getElementById('profilesContainer');
    if (state.profiles.length === 0) {
        root.innerHTML = `<div class="card" style="text-align:center; color:#6b7280;">Добавьте первую номенклатуру кнопкой ниже</div>`;
        return;
    }
    root.innerHTML = state.profiles.map(profileHtml).join('');
}

function findProfile(el) {
    const card = el.closest('[data-pid]');
    if (!card) return null;
    const id = +card.dataset.pid;
    return state.profiles.find(p => p.id === id);
}

document.getElementById('profilesContainer').addEventListener('input', e => {
    const t = e.target;
    const p = findProfile(t);
    if (!p) return;
    if (t.matches('[data-name]')) { p.name = t.value; save(); return; }
    if (t.matches('[data-custom-len]')) {
        const v = parseInt(t.value, 10) || 0; if (v > 0) { p.barLen = v; save(); }
        return;
    }
    if (t.matches('[data-ci]')) {
        const ci = +t.dataset.ci, k = t.dataset.k;
        p.cuts[ci][k] = parseInt(t.value, 10) || 0;
        // обновим счётчик в шапке без полного перерендера
        const meta = t.closest('[data-pid]').querySelector('.nom-meta');
        const total = p.cuts.reduce((s, c) => s + ((c.length | 0) > 0 && (c.qty | 0) > 0 ? c.qty : 0), 0);
        if (meta) meta.textContent = total ? total + ' отр.' : '—';
        save();
    }
});

document.getElementById('profilesContainer').addEventListener('click', e => {
    const t = e.target;
    const p = findProfile(t);
    if (!p) return;

    if (t.closest('[data-toggle]')) { p.collapsed = !p.collapsed; renderProfiles(); save(); return; }
    if (t.closest('[data-del-prof]')) {
        if (state.profiles.length === 1 || confirm(`Удалить номенклатуру «${p.name || 'без названия'}»?`)) {
            state.profiles = state.profiles.filter(x => x.id !== p.id);
            renderProfiles(); save();
        }
        return;
    }
    const lenBtn = t.closest('[data-len-toggle] button');
    if (lenBtn) {
        const v = lenBtn.dataset.len;
        if (v === 'custom') { p.barLen = (p.barLen === 6000 || p.barLen === 12000) ? 11700 : p.barLen; }
        else { p.barLen = parseInt(v, 10); }
        renderProfiles(); save(); return;
    }
    const delCut = t.closest('[data-del-cut]');
    if (delCut) { p.cuts.splice(+delCut.dataset.delCut, 1); renderProfiles(); save(); return; }
    if (t.closest('[data-add-cut]')) { p.cuts.push({ length: 0, qty: 0 }); renderProfiles(); save(); return; }
    if (t.closest('[data-clear-cuts]')) {
        if (!p.cuts.length || confirm('Очистить все строки?')) { p.cuts = []; renderProfiles(); save(); }
        return;
    }
});

// === Параметры заказа ===
const fOrder = document.getElementById('fOrder');
const fKerf = document.getElementById('fKerf');

fOrder.addEventListener('input', () => { state.order = fOrder.value; save(); });

// === Оптимизатор ===
// Алгоритм: «best pattern next» — на каждой итерации находим оптимальное
// заполнение одной заготовки через 0/1-knapsack DP по длине.
// Хитрость с резом (kerf): к каждому отрезку добавляем kerf, к ёмкости тоже +kerf —
// так n отрезков на одной заготовке корректно учитывают (n-1) резов между ними.

function bestPattern(items, capacity) {
    const n = items.length;
    const cap = capacity | 0;
    if (n === 0 || cap <= 0) return { picks: [], sum: 0 };
    const dp = new Int32Array(cap + 1);
    const take = new Uint8Array(n * (cap + 1));
    for (let i = 0; i < n; i++) {
        const w = items[i].w;
        if (w > cap) continue;
        const off = i * (cap + 1);
        for (let c = cap; c >= w; c--) {
            const v = dp[c - w] + w;
            if (v > dp[c]) { dp[c] = v; take[off + c] = 1; }
        }
    }
    let bestC = 0, bestV = 0;
    for (let c = 0; c <= cap; c++) if (dp[c] > bestV) { bestV = dp[c]; bestC = c; }
    let c = bestC;
    const picks = [];
    for (let i = n - 1; i >= 0; i--) {
        if (take[i * (cap + 1) + c]) { picks.push(i); c -= items[i].w; }
    }
    return { picks, sum: bestV };
}

function optimize(cuts, barLen, kerf, minRem) {
    const items = [];
    let nid = 0;
    cuts.forEach((c, ci) => {
        const len = c.length | 0, qty = c.qty | 0;
        if (len <= 0 || qty <= 0) return;
        for (let q = 0; q < qty; q++) items.push({ id: nid++, len, mark: c.mark || '', srcIdx: ci });
    });
    if (items.length > 1500) return { error: `Слишком много отрезков (${items.length}). Лимит 1500 — разбейте на части.` };
    if (items.length === 0) return { error: 'Не задано ни одного отрезка с длиной и количеством.' };

    const placeable = [], unplaced = [];
    for (const it of items) (it.len > barLen ? unplaced : placeable).push(it);

    const bars = [];
    let remaining = placeable.slice();
    const cap = (barLen + kerf) | 0;
    let safety = remaining.length + 5;

    while (remaining.length > 0 && safety-- > 0) {
        const dpItems = remaining.map((it, idx) => ({ idx, w: (it.len + kerf) | 0 }));
        const pat = bestPattern(dpItems, cap);
        if (pat.picks.length === 0) break;
        const placedSet = new Set(pat.picks);
        const placed = pat.picks.map(i => remaining[i]).sort((a, b) => b.len - a.len);
        const cutsLen = placed.reduce((s, it) => s + it.len, 0);
        const kerfTot = Math.max(0, placed.length - 1) * kerf;
        const tail = Math.max(0, barLen - cutsLen - kerfTot);
        bars.push({ cuts: placed, usedLen: cutsLen, kerfTotal: kerfTot, tail, isRemnant: tail >= minRem });
        remaining = remaining.filter((_, idx) => !placedSet.has(idx));
    }

    const totalBarsLen = bars.length * barLen;
    const totalCutsLen = bars.reduce((s, b) => s + b.usedLen, 0);
    const totalKerf = bars.reduce((s, b) => s + b.kerfTotal, 0);
    const totalRemnant = bars.filter(b => b.isRemnant).reduce((s, b) => s + b.tail, 0);
    const totalWaste = bars.filter(b => !b.isRemnant).reduce((s, b) => s + b.tail, 0) + totalKerf;

    return { bars, unplaced, totalBarsLen, totalCutsLen, totalKerf, totalRemnant, totalWaste, barLen, kerf, minRem };
}

// === Утилиты ===
function esc(s) { return String(s ?? '').replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMm(mm) { return mm >= 1000 ? (mm / 1000).toFixed(2).replace(/\.?0+$/, '') + ' м' : Math.round(mm) + ' мм'; }
function pct(p) { return p.toFixed(1) + '%'; }
function fmtMoney(v) {
    if (!v) return 'Безкоштовно';
    const r = Math.round(v * 100) / 100;
    const s = r.toFixed(r % 1 === 0 ? 0 : 2).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return s + ' грн';
}

// === Рендер результата ===
function renderResult(report) {
    const root = document.getElementById('result');
    if (!report) { root.classList.remove('show'); root.innerHTML = ''; return; }
    const dateStr = new Date().toLocaleDateString('ru-RU');

    let html = '';
    html += `<div class="print-header wh-print-header">
        <h1>Карта раскроя</h1>
        <div class="meta">Заказ: <b>${esc(state.order) || '—'}</b> · Дата: ${dateStr}</div>
    </div>`;

    // Предварительно посчитаем резы и стоимость для каждого блока
    report.results.forEach(entry => {
        const r = entry.r;
        if (!r || r.error || !r.bars) { entry.sawCuts = 0; entry.cost = 0; return; }
        entry.sawCuts = r.bars.reduce((s, b) => {
            const n = b.cuts.length;
            if (n === 0) return s;
            return s + (n - 1) + (b.tail > 0 ? 1 : 0);
        }, 0);
        entry.cost = entry.sawCuts * (+entry.profile.cutPrice || 0);
    });

    // Общая сводка по всем номенклатурам
    const totalBars = report.results.reduce((s, x) => s + (x.r.bars ? x.r.bars.length : 0), 0);
    const totalLen = report.results.reduce((s, x) => s + (x.r.totalBarsLen || 0), 0);
    const totalCutsLen = report.results.reduce((s, x) => s + (x.r.totalCutsLen || 0), 0);
    const totalWaste = report.results.reduce((s, x) => s + (x.r.totalWaste || 0), 0);
    const totalRem = report.results.reduce((s, x) => s + (x.r.totalRemnant || 0), 0);
    const totalSawCuts = report.results.reduce((s, x) => s + (x.sawCuts || 0), 0);
    const totalCost = report.results.reduce((s, x) => s + (x.cost || 0), 0);
    const usedPct = totalLen > 0 ? (totalCutsLen / totalLen * 100) : 0;
    const wastePct = totalLen > 0 ? (totalWaste / totalLen * 100) : 0;

    html += `<div class="card order-summary"><h2 class="no-print">Сводка по заказу</h2>
        <div class="summary">
            <div class="stat"><div class="k">Номенклатур</div><div class="v">${report.results.length}</div></div>
            <div class="stat"><div class="k">Хлыстов всего</div><div class="v">${totalBars}</div></div>
            <div class="stat"><div class="k">Длина металла</div><div class="v">${fmtMm(totalLen)}</div></div>
            <div class="stat good"><div class="k">В деталях</div><div class="v">${pct(usedPct)}</div></div>
            <div class="stat warn"><div class="k">Остаток</div><div class="v">${fmtMm(totalRem)}</div></div>
            <div class="stat"><div class="k">Резов всего</div><div class="v" data-total-saw>${totalSawCuts}</div></div>
            <div class="stat cost"><div class="k">Стоимость резов</div><div class="v" data-total-cost>${fmtMoney(totalCost)}</div></div>
        </div>
        <div class="legend no-print">
            <span><i style="background:#bfdbfe;border-color:#1d4ed8;"></i>отрез</span>
            <span><i style="background:#fde68a;border-color:#b45309;"></i>остаток</span>
            <span><i style="background:#374151;border-color:#374151;"></i>пропил</span>
        </div>
    </div>`;

    // Блок на каждую номенклатуру
    report.results.forEach((entry, idx) => {
        const { profile: p, r } = entry;
        const blockId = 'block_' + p.id;
        const collapsed = !!entry.collapsed;
        if (r.error) {
            html += `<div class="result-block">
                <div class="result-head">
                    <span class="title">${esc(p.name) || 'Номенклатура #' + (idx + 1)}</span>
                    <span class="meta">${fmtMm(p.barLen)} · ошибка</span>
                </div>
                <div class="result-body"><div class="unplaced">${esc(r.error)}</div></div>
            </div>`;
            return;
        }
        const usedP = r.totalBarsLen > 0 ? (r.totalCutsLen / r.totalBarsLen * 100) : 0;
        const sawCuts = entry.sawCuts;
        const price = +p.cutPrice || 0;
        const cost = entry.cost;
        let bodyHtml = `<div class="summary">
            <div class="stat"><div class="k">Хлыстов</div><div class="v">${r.bars.length}</div></div>
            <div class="stat"><div class="k">Заготовка</div><div class="v">${fmtMm(r.barLen)}</div></div>
            <div class="stat good"><div class="k">В деталях</div><div class="v">${pct(usedP)}</div></div>
            <div class="stat warn"><div class="k">Остаток</div><div class="v">${fmtMm(r.totalRemnant)}</div></div>
            <div class="stat"><div class="k">Резов</div><div class="v">${sawCuts}</div></div>
            <div class="stat no-wh-print"><div class="k">Цена реза, грн</div><div class="v"><input class="price-input" type="number" min="0" step="0.5" value="${price || ''}" data-price="${p.id}" placeholder="0"></div></div>
            <div class="stat cost no-wh-print"><div class="k">Стоимость резов</div><div class="v" data-cost="${p.id}">${fmtMoney(cost)}</div></div>
        </div>`;
        r.bars.forEach((b, i) => { bodyHtml += renderBarSvg(b, i + 1, r.barLen, r.kerf, p.name); });
        if (r.unplaced && r.unplaced.length) {
            const list = r.unplaced.map(u => `${u.len} мм`).join(', ');
            bodyHtml += `<div class="unplaced"><b>Не помещаются в заготовку ${fmtMm(r.barLen)}:</b> ${r.unplaced.length} шт. — ${list}</div>`;
        }
        html += `<div class="result-block" data-block="${blockId}">
            <div class="result-head" data-block-toggle>
                <span class="caret">${collapsed ? '+' : '−'}</span>
                <span class="title">${esc(p.name) || 'Номенклатура #' + (idx + 1)}</span>
                <span class="badge">${r.bars.length} ${pluralBars(r.bars.length)}</span>
                <span class="meta">${fmtMm(r.barLen)} · ${r.bars.reduce((s,b)=>s+b.cuts.length,0)} отр.</span>
            </div>
            <div class="result-body ${collapsed ? 'hidden' : ''}">${bodyHtml}</div>
        </div>`;
    });

    // Клиентская сводка — оформлена под стиль складских блоков
    let cvHtml = `<div class="client-view">
        <div class="print-header" style="display:block;">
            <h1>Заказ ${esc(state.order) || '—'}</h1>
            <div class="meta">Дата: ${dateStr}</div>
        </div>`;
    report.results.forEach((entry, idx) => {
        const p = entry.profile, r = entry.r;
        const validCuts = p.cuts.filter(c => (c.length | 0) > 0 && (c.qty | 0) > 0);
        const totalQty = validCuts.reduce((s, c) => s + (c.qty | 0), 0);
        const usedP = (r && !r.error && r.totalBarsLen > 0) ? (r.totalCutsLen / r.totalBarsLen * 100) : 0;
        cvHtml += `<div class="cv-block">
            <div class="cv-head">
                <span class="title">${esc(p.name) || 'Номенклатура #' + (idx + 1)}</span>
                ${(r && !r.error) ? `<span class="badge">${r.bars.length} ${pluralBars(r.bars.length)}</span>` : ''}
                <span class="meta">${fmtMm(p.barLen)} · ${totalQty} шт.</span>
            </div>
            <div class="cv-body">`;
        if (r && !r.error) {
            cvHtml += `<div class="summary">
                <div class="stat"><div class="k">Хлыстов</div><div class="v">${r.bars.length}</div></div>
                <div class="stat"><div class="k">Заготовка</div><div class="v">${fmtMm(p.barLen)}</div></div>
                <div class="stat good"><div class="k">В деталях</div><div class="v">${pct(usedP)}</div></div>
                <div class="stat"><div class="k">Резов</div><div class="v">${entry.sawCuts || 0}</div></div>
                <div class="stat cost"><div class="k">Стоимость резов</div><div class="v">${fmtMoney(entry.cost || 0)}</div></div>
            </div>`;
        }
        cvHtml += `<table class="cv-tbl"><thead><tr><th>№</th><th>Длина, мм</th><th>Кол-во</th></tr></thead><tbody>`;
        validCuts.forEach((c, i) => {
            cvHtml += `<tr><td>${i + 1}</td><td>${c.length}</td><td>${c.qty}</td></tr>`;
        });
        cvHtml += `</tbody></table>
            </div>
        </div>`;
    });
    cvHtml += `<div class="cv-foot">ИТОГО: ${totalBars} ${pluralBars(totalBars)} · Резов: ${totalSawCuts} · Стоимость резов: ${fmtMoney(totalCost)}</div>`;
    cvHtml += `</div>`;
    html += cvHtml;

    html += `<div class="footer-act no-print">
        <button class="btn primary" id="btnPrintWh">🖨 Карта раскроя (склад)</button>
        <button class="btn primary" id="btnPrintCl">🖨 Заказ (клиент)</button>
        <button class="btn" id="btnCsv">Экспорт CSV</button>
        <button class="btn ghost" id="btnHide">Скрыть</button>
    </div>`;

    root.classList.add('show');
    root.innerHTML = html;

    root.addEventListener('click', e => {
        const head = e.target.closest('[data-block-toggle]');
        if (!head) return;
        const block = head.parentElement;
        const body = block.querySelector('.result-body');
        const caret = head.querySelector('.caret');
        const hide = !body.classList.contains('hidden');
        body.classList.toggle('hidden', hide);
        if (caret) caret.textContent = hide ? '+' : '−';
    });

    root.addEventListener('input', e => {
        const inp = e.target.closest('[data-price]');
        if (!inp) return;
        const pid = +inp.dataset.price;
        const entry = report.results.find(x => x.profile.id === pid);
        if (!entry) return;
        const price = parseFloat(inp.value) || 0;
        entry.profile.cutPrice = price;
        entry.cost = (entry.sawCuts || 0) * price;
        const costEl = root.querySelector(`[data-cost="${pid}"]`);
        if (costEl) costEl.textContent = fmtMoney(entry.cost);
        const totalCost = report.results.reduce((s, x) => s + (x.cost || 0), 0);
        const totalEl = root.querySelector('[data-total-cost]');
        if (totalEl) totalEl.textContent = fmtMoney(totalCost);
        save();
    });

    function printAs(mode) {
        document.body.classList.toggle('print-client', mode === 'client');
        window.print();
    }
    window.addEventListener('afterprint', () => document.body.classList.remove('print-client'), { once: true });
    document.getElementById('btnPrintWh').addEventListener('click', () => printAs('warehouse'));
    document.getElementById('btnPrintCl').addEventListener('click', () => printAs('client'));
    document.getElementById('btnCsv').addEventListener('click', () => exportCsv(report));
    document.getElementById('btnHide').addEventListener('click', () => {
        root.classList.remove('show'); root.innerHTML = ''; window.scrollTo({ top: 0, behavior: 'smooth' });
    });
}

function pluralBars(n) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 'хлыст';
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'хлыста';
    return 'хлыстов';
}

function renderBarSvg(b, num, barLen, kerf, profileName) {
    const W = 1000, H = 38;
    const scale = W / barLen;
    const palette = ['#bfdbfe','#a7f3d0','#fde68a','#fbcfe8','#c7d2fe','#fed7aa','#bae6fd','#d9f99d','#fecaca','#e9d5ff'];
    const colorByKey = new Map();
    let ci = 0;
    let x = 0;
    let svg = `<svg class="bar-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
    svg += `<rect x="0" y="2" width="${W}" height="${H - 4}" fill="#fff" stroke="#9ca3af"/>`;
    b.cuts.forEach((c, idx) => {
        const w = c.len * scale;
        const key = c.mark || ('L' + c.len);
        if (!colorByKey.has(key)) { colorByKey.set(key, palette[ci % palette.length]); ci++; }
        const fill = colorByKey.get(key);
        svg += `<rect class="cut" x="${x.toFixed(2)}" y="2" width="${w.toFixed(2)}" height="${H - 4}" fill="${fill}"/>`;
        if (w > 30) svg += `<text x="${(x + w / 2).toFixed(2)}" y="${(H / 2).toFixed(2)}" text-anchor="middle" dominant-baseline="central">${c.len}</text>`;
        x += w;
        if (idx < b.cuts.length - 1 && kerf > 0) {
            const kw = Math.max(0.6, kerf * scale);
            svg += `<rect x="${x.toFixed(2)}" y="2" width="${kw.toFixed(2)}" height="${H - 4}" fill="#374151"/>`;
            x += kw;
        }
    });
    if (b.tail > 0) {
        const tw = b.tail * scale;
        svg += `<rect class="${b.isRemnant ? 'tail-rem' : 'tail-waste'}" x="${x.toFixed(2)}" y="2" width="${tw.toFixed(2)}" height="${H - 4}"/>`;
        if (tw > 32) svg += `<text x="${(x + tw / 2).toFixed(2)}" y="${(H / 2).toFixed(2)}" text-anchor="middle" dominant-baseline="central">${Math.round(b.tail)}</text>`;
    }
    svg += `</svg>`;

    const tailLabel = b.tail <= 0 ? 'без остатка' : `остаток ${Math.round(b.tail)} мм`;
    const nameTxt = profileName ? ' ' + esc(profileName) : '';
    return `<div class="bar">
        <div class="bar-head">
            <span><b>Хлыст${nameTxt} №${num}</b> · ${b.cuts.length} отр.</span>
            <span>${tailLabel}</span>
        </div>
        ${svg}
    </div>`;
}

function exportCsv(report) {
    const rows = [];
    rows.push(['Заказ', state.order || '']);
    rows.push(['Рез, мм', state.kerf]);
    rows.push(['Мин. обрезок, мм', state.minRem]);
    rows.push([]);
    report.results.forEach((entry, idx) => {
        const { profile: p, r } = entry;
        rows.push([`Номенклатура ${idx + 1}`, p.name || '']);
        rows.push(['Заготовка, мм', p.barLen]);
        if (r.error) { rows.push(['Ошибка', r.error]); rows.push([]); return; }
        rows.push(['Хлыст №', 'Отрез №', 'Длина, мм']);
        r.bars.forEach((b, i) => {
            b.cuts.forEach((c, j) => rows.push([i + 1, j + 1, c.len]));
            rows.push([i + 1, '', `— остаток ${Math.round(b.tail)} мм (${b.isRemnant ? 'деловой' : 'остаток'}) —`]);
        });
        rows.push(['ИТОГО хлыстов', r.bars.length]);
        rows.push(['Общая длина, мм', r.totalBarsLen]);
        rows.push(['В деталях, мм', r.totalCutsLen]);
        rows.push(['Деловых обрезков, мм', r.totalRemnant]);
        rows.push(['Остатков (с резом), мм', r.totalWaste]);
        rows.push(['Резов, шт', entry.sawCuts || 0]);
        rows.push(['Цена реза, грн', p.cutPrice || 0]);
        rows.push(['Стоимость резов, грн', entry.cost || 0]);
        rows.push([]);
    });
    const grandCost = report.results.reduce((s, x) => s + (x.cost || 0), 0);
    const grandSaw = report.results.reduce((s, x) => s + (x.sawCuts || 0), 0);
    rows.push(['ИТОГО резов по заказу, шт', grandSaw]);
    rows.push(['ИТОГО стоимость резов, грн', grandCost]);
    const csv = rows.map(row => row.map(v => {
        const s = String(v ?? '');
        return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }).join(';')).join('\r\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const name = (state.order || 'order').replace(/[^\w\-А-Яа-яЁё]/g, '_');
    a.href = url; a.download = `raskroy_${name}_${Date.now()}.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
}

document.getElementById('btnCalc').addEventListener('click', () => {
    if (!state.profiles.length) { alert('Добавьте хотя бы одну номенклатуру.'); return; }
    const valid = state.profiles.filter(p => p.cuts.some(c => (c.length | 0) > 0 && (c.qty | 0) > 0));
    if (!valid.length) { alert('Заполните хотя бы один отрезок с длиной и количеством.'); return; }

    const results = state.profiles.map(p => ({
        profile: p,
        collapsed: false,
        r: (p.barLen > 0 && p.cuts.some(c => (c.length | 0) > 0 && (c.qty | 0) > 0))
            ? optimize(p.cuts, p.barLen, state.kerf, state.minRem)
            : { error: 'Не задано отрезков или длины заготовки', bars: [] },
    }));
    state.result = { results };
    renderResult(state.result);
    setTimeout(() => document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
});

// === Init ===
load();
if (state.profiles.length === 0) state.profiles.push(newProfile('', 12000));
applyStateToUI();
renderProfiles();
